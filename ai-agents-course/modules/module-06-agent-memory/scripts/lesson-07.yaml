  - type: title
    chapter: Next up
    kicker: Coming next · Module 7
    title: Reliable and Efficient Agents
    subtitle: "Async, retries with backoff, caching, rate limits, loop prevention, token budgets, logging and tracing. Project: a Resilient API Agent."
    say: >
      That's Module 6 complete. Your agent now remembers: within a chat, across days, and only what it should, with every user's data kept apart.
      In Module 7, we make agents reliable and efficient: retries, caching, budgets, and tracing what they do. See you there.
