  - type: quiz
    number: 2
    question: "Which command adds a line to the END of `notes.txt` without deleting what is there?"
    options:
      - "`echo \"hi\" > notes.txt`"
      - "`echo \"hi\" >> notes.txt`"
      - "`cat \"hi\" notes.txt`"
      - "`touch notes.txt \"hi\"`"
    answer: 1
    explain: "`>>` appends. A single `>` overwrites the file."
    say_question: >
      Doosra question. Kaunsi command notes dot txt ke end mein line jodti hai, purana content mitaye bina?
    say_answer: >
      B, do greater than signs. Ek greater than sign poori file ko overwrite kar deta hai.

