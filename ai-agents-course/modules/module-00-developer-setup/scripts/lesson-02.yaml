  - type: interview
    chapter: Interview corner
    items:
      - q: "Why do Python projects use virtual environments?"
        a: "To **isolate** each project's packages and versions, so projects don't break each other, and so the setup can be **reproduced** exactly from `requirements.txt` on any machine."
        trap: "\"To make Python faster.\" A venv changes which packages are used, not speed."
        say_q: "Interview corner. Pehla question: Python projects virtual environments kyun use karte hain?"
        say_a: "Answer: har project ke packages aur versions ko isolate karne ke liye, taaki projects ek doosre ko na todein. Aur taaki requirements dot txt se kisi bhi machine par exact same setup ban sake. Trap: yeh bolna ki venv Python ko fast banata hai. Venv sirf yeh badalta hai ki kaunse packages use honge."
      - q: "Do you commit the `.venv` folder?"
        a: "No. Commit `requirements.txt` (the recipe) and ignore `.venv` (it is big, machine-specific and rebuildable with `pip install -r requirements.txt`)."
        trap: "Committing `.venv` \"so teammates don't need to install\". It breaks on other operating systems and Python versions."
        say_q: "Doosra: kya aap dot venv folder commit karte ho?"
        say_a: "Answer: nahi. Recipe commit karo, yaani requirements dot txt. Dot venv ko ignore karo, kyunki woh bada hai, machine specific hai, aur dobara ban sakta hai. Trap: yeh sochna ki dot venv commit karne se teammates ka time bachega. Doosre operating system ya Python version par woh toot jaata hai."
      - q: "How do you handle API keys in a Python project?"
        a: "Read them from **environment variables**, loaded from a git-ignored `.env` in development or a secrets manager in production. Commit only `.env.example` with names and placeholders. Never print or log the value; revoke a key if it leaks."
        trap: "Hard-coding the key \"just for now\". It ends up in git history."
        say_q: "Teesra: Python project mein API keys kaise handle karte ho?"
        say_a: "Answer: environment variables se padhte hain. Development mein ek git ignored dot env file se, aur production mein secrets manager se. Git mein sirf dot env dot example jaati hai, naam aur placeholders ke saath. Key ki value kabhi print ya log nahi karte, aur leak ho toh revoke. Trap: bas abhi ke liye key code mein likh dena. Woh git history mein reh jaati hai."

