      - {text: "`python3 -m venv .venv` → `source .venv/bin/activate` → `deactivate`", say: "Banao, activate karo, aur kaam ke baad deactivate."}
      - {text: "`pip install pkg==x.y.z` · `pip freeze > requirements.txt` · `pip install -r`", say: "pip se exact versions install karo, freeze se recipe likho, aur dash r se dobara banao."}
