  - type: quiz
    chapter: Quick check
    number: 1
    question: "Which file should you commit so a teammate can rebuild your environment?"
    options:
      - "`.venv/`"
      - "`.env`"
      - "`requirements.txt`"
      - "`__pycache__/`"
    answer: 2
    explain: "`requirements.txt` is the recipe. `.venv` is rebuilt from it, `.env` holds private values, and `__pycache__` is generated."
    say_question: >
      Quick check. Teammate ko aapka environment dobara banane ke liye kaunsi file commit karni chahiye?
    say_answer: >
      C, requirements dot txt. Woh recipe hai. Dot venv usi se banta hai, dot env private hai, aur pycache Python khud banata hai.

  - type: quiz
    number: 2
    question: "`os.environ.get(\"DEBUG\")` returns `\"False\"`. What is `bool(\"False\")`?"
    options:
      - "`False`"
      - "`True`"
      - "`None`"
      - "an error"
    answer: 1
    explain: "Any non-empty string is truthy. Compare the text instead: `value.lower() == \"true\"`, as `show_config.py` does."
    say_question: >
      Doosra question, thoda tricky. Environment se DEBUG ki value string False aayi. bool of string False kya hoga?
    say_answer: >
      True! Koi bhi non empty string True hoti hai. Isliye show config dot py text ko true se compare karta hai.

