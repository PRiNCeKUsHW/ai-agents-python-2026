module_title: Your Developer Setup
title: "Git and GitHub: Save, Commit, Push and Share Your Work"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 0 · Lesson 3
    title: Git and GitHub
    subtitle: Save your work, see its history, undo mistakes, and share it. Your first GitHub repository.
    say: >
      Lesson teen mein swagat hai, Module zero ka aakhri lesson. Aaj hum Git aur GitHub seekhenge.
      Git se aap apne project ki har version save karte ho, purani history dekhte ho, aur galti undo karte ho. GitHub par aap apna project share karte ho, aur doosre computers par le jaate ho.
      Lesson ke end mein aapka pehla repository poora ready hoga, aur setup checker chhe mein se chhe dikhayega.

  - type: objectives
    items:
      - {text: "Explain version control, and Git vs GitHub", say: "Iss lesson ke baad aap version control explain kar paoge, aur Git aur GitHub ka farak."}
      - {text: "Make commits: `init`, `status`, `add`, `commit`, `log`", say: "Commits banana: init, status, add, commit, aur log."}
      - {text: "Keep `.env` and `.venv` out with `.gitignore`", say: "Dot gitignore se dot env aur dot venv ko bahar rakhna."}
      - {text: "See and undo changes: `diff`, `restore`; work on a branch", say: "Changes dekhna aur undo karna, aur ek branch par kaam karna."}
      - {text: "Push, clone and pull with a remote, the way GitHub works", say: "Aur remote ke saath push, clone, aur pull, bilkul GitHub ki tarah."}

  - type: callout
    chapter: What is version control?
    kind: analogy
    title: "Git is save points in a video game"
    body: "Before a hard level, you **save the game**. If things go wrong, you go back to the save point. A **commit** is a save point for your project: a snapshot of every file, with a message saying what changed, that you can always return to."
    say: >
      Pehle what. Version control kya hai? Video game socho. Mushkil level se pehle aap game save karte ho. Kuch galat hua, toh wapas save point par.
      Git mein save point ko commit kehte hain. Commit aapke project ki har file ki ek photo hai, ek message ke saath ki kya badla. Aur aap kabhi bhi kisi bhi commit par wapas ja sakte ho.

  - type: compare
    heading: "Why version control?"
    left:
      title: "Without Git"
      tone: coral
      label: Chaos
      items:
        - "`app.py`, `app_v2.py`, `app_final.py`, `app_final_REAL.py`"
        - "\"Which version worked yesterday?\" Nobody knows"
        - "One deleted line, and it's gone forever"
        - "Sharing = emailing zip files"
    right:
      title: "With Git"
      tone: teal
      label: Calm
      items:
        - "One `app.py`, with its full history inside `.git`"
        - "Every change has a date, an author and a reason"
        - "Undo any change, or go back to any commit"
        - "Share with `push`; teammates get it with `pull`"
    steps:
      - show: left
        say: >
          Ab why. Bina Git ke kya hota hai? app final, app final real, app final real version two. Kal kaunsa version chal raha tha, kisi ko yaad nahi. Ek line delete hui, toh hamesha ke liye gayi. Aur share karna matlab zip file email karna.
      - show: right
        say: >
          Git ke saath ek hi file, aur uski poori history dot git folder ke andar. Har change ki date, author, aur reason. Koi bhi change undo ho sakta hai. Aur sharing push aur pull se. Har company, har open source project, aur har AI engineering team Git use karti hai.

  - type: table
    heading: "Git is not GitHub"
    columns: ["", Git, GitHub]
    widths: [1, 2, 2]
    rows:
      - {cells: ["What", "A program on **your computer**", "A **website** that stores Git repositories"], say: "Ek bahut common confusion. Git ek program hai jo aapke computer par chalta hai."}
      - {cells: ["Does", "Commits, history, branches, undo", "Hosting, sharing, pull requests, portfolio"], say: "GitHub ek website hai jo Git repositories ko online store karti hai, aur unhe share karna aasaan banati hai."}
      - {cells: ["Needs internet?", "No", "Yes"], say: "Git bina internet ke poora kaam karta hai. GitHub ke liye internet chahiye."}
      - {cells: ["Alternatives", "(Git is the standard)", "GitLab, Bitbucket, Azure DevOps"], say: "GitHub ke alternatives bhi hain, jaise GitLab aur Bitbucket. Lekin commands sab jagah Git ki hi hain.", tone: teal}

  - type: diagram
    chapter: How Git works
    heading: "Three places your changes travel through"
    nodes:
      - {id: work, label: "Working folder", sub: "files you edit", x: 170, y: 200, w: 300, h: 120, tone: blue}
      - {id: stage, label: "Staging area", sub: "the next commit", x: 760, y: 200, w: 300, h: 120, tone: amber}
      - {id: repo, label: "Repository", sub: ".git: the history", x: 1350, y: 200, w: 300, h: 120, tone: teal}
      - {id: remote, label: "Remote (GitHub)", sub: "others can reach it", x: 1350, y: 560, w: 300, h: 120, tone: violet}
    edges:
      - {from: work, to: stage, label: "git add"}
      - {from: stage, to: repo, label: "git commit"}
      - {from: repo, to: remote, label: "git push"}
    say: >
      Ab how. Git mein aapke changes teen jagah se hokar guzarte hain. Isse ek parcel bhejne ki tarah samjhati hoon.
    steps:
      - show: [work]
        say: >
          Pehli jagah, working folder. Yahan aap files edit karte ho. Yeh aapka table hai, jahan saaman bikhra hai.
      - show: [stage, "work->stage"]
        flow: ["work->stage"]
        say: >
          Doosri, staging area. git add se aap chunte ho ki kaunsi changes agle commit mein jaayengi. Yeh box mein saaman pack karna hai. Jo pack nahi kiya, woh nahi jaayega.
      - show: [repo, "stage->repo"]
        flow: ["stage->repo"]
        say: >
          Teesri, repository. git commit box ko seal karta hai, label lagata hai, aur history mein rakh deta hai. Yeh sab dot git folder mein hota hai, aapke computer par.
      - show: [remote, "repo->remote"]
        flow: ["repo->remote"]
        focus: [remote]
        say: >
          Aur chauthi jagah, remote, jaise GitHub. git push aapke commits wahan bhejta hai, taaki doosre log, ya aapka doosra laptop, unhe le sake.

  - type: terminal
    chapter: One-time setup
    heading: "Tell Git who you are (once per computer)"
    title: terminal — bash
    cwd: tmp:projects
    alias: /home/student/projects
    steps:
      - cmd: git config --global user.name "Riya Sharma"
        run: >-
          mkdir -p my-first-repo && cd my-first-repo
          && cp -a "$MODULE_DIR/project/my-first-repo/." .
          && rm -rf __pycache__ tests/__pycache__ .pytest_cache .mypy_cache
          && cp .env.example .env
          && PATH=/usr/local/bin:/usr/bin:/bin python3 -m venv .venv
          && .venv/bin/pip install -q --disable-pip-version-check -r requirements.txt
          && git config --global user.name "Riya Sharma"
        say: >
          Shuru karne se pehle, Git ko batao ki aap kaun ho. Har commit par yeh naam likha jaayega. Yeh setting ek computer par sirf ek baar karni hoti hai. Iss video mein demo ka naam hai Riya Sharma. Aap apna naam likhna.
      - cmd: git config --global user.email "riya@example.com"
        say: >
          Aur email. GitHub par wahi email use karo jo aapke GitHub account mein hai. Privacy chahiye, toh GitHub settings mein ek no reply email milta hai, woh bhi chalega. Yahan example dot com ka demo email hai.
      - cmd: git config --global init.defaultBranch main
        say: >
          Aur yeh setting naye repositories ki pehli branch ka naam main rakhti hai, jo aaj ka standard hai. Branch kya hoti hai, thodi der mein.
      - cmd: git config --global --list
        say: >
          Aur list se check karo. Teeno settings save ho gayi.

  - type: terminal
    chapter: Your first commit
    heading: "git init and git status"
    title: terminal — bash · ~/projects/my-first-repo
    cwd: tmp:projects
    alias: /home/student/projects
    say: >
      Ab hamara project folder. Isme woh sab hai jo pichle do lessons mein bana: code, requirements dot txt, dot env, aur dot venv.
    steps:
      - cmd: ls -a
        run: cd my-first-repo && ls -aC -T 0
        say: >
          ls dash a se dekho. Code files, tests folder, dot env, dot env dot example, dot gitignore, aur dot venv. Dot gitignore ke andar kya hai, ek minute mein dekhenge.
      - cmd: git init
        run: cd my-first-repo && git init
        say: >
          git init iss folder ko Git repository bana deta hai. Isne ek dot git folder banaya. Poori history isi mein rahegi. Iss folder ko kabhi haath se mat chhedna.
      - cmd: git status
        run: cd my-first-repo && git status
        say: >
          git status, sabse zyaada use hone wali Git command. Yeh batati hai ki abhi kya haal hai. Branch main, abhi tak koi commit nahi, aur yeh rahi untracked files, yaani woh files jo Git ne abhi tak track nahi ki.
          Ab dhyan se dekho, aur bataao kya missing hai. Dot env yahan nahi hai. Dot venv bhi nahi hai. Kyun? Dot gitignore ki wajah se.

  - type: code
    heading: "`.gitignore`: files Git must never track"
    title: .gitignore
    file: project/my-first-repo/.gitignore
    lang: bash
    steps:
      - lines: "1-2"
        note: "Secrets: `.env` never enters git."
        say: >
          Yeh hai dot gitignore. Ek simple text file, jisme har line ek naam ya pattern hai jise Git ignore kare. Pehla aur sabse important: dot env, hamare secrets.
      - lines: "4-5"
        note: "The venv: rebuilt from `requirements.txt`."
        say: >
          Doosra, dot venv folder. Lesson do yaad karo: yeh recipe se dobara banta hai, git mein nahi jaata. Slash ka matlab hai: yeh ek folder hai.
      - lines: "7-11"
        note: "`*` matches anything: `*.pyc` = every file ending in `.pyc`."
        say: >
          Aur Python ki cache files. Star ka matlab kuch bhi. Star dot pyc matlab har woh file jiska naam dot pyc par khatam ho.
    outro: >
      Golden rule: dot gitignore pehle commit se pehle banao. Agar secret ek baar commit ho gaya, toh woh history mein reh jaata hai, chahe baad mein delete karo.

  - type: terminal
    heading: "Prove it, then stage and commit"
    title: terminal — bash · ~/projects/my-first-repo
    cwd: tmp:projects
    alias: /home/student/projects
    steps:
      - cmd: git check-ignore -v .env .venv
        run: cd my-first-repo && git check-ignore -v .env .venv
        say: >
          git check ignore dash v batata hai ki koi file kyun ignore ho rahi hai. Dot env, gitignore ki line do ki wajah se, aur dot venv, line paanch ki wajah se. Jab bhi doubt ho, yahi command chalao.
      - cmd: git add .
        run: cd my-first-repo && git add .
        say: >
          Ab git add dot. Dot matlab yeh folder, yaani saari changes, staging area mein. Ignored files apne aap bahar reh jaati hain.
      - cmd: git status --short
        run: cd my-first-repo && git status --short
        say: >
          git status dash dash short, chhota version. A matlab added, yaani staged. Har file commit ke liye pack ho gayi. Aur ek baar phir: na dot env, na dot venv.
      - cmd: 'git commit -m "First commit: hello.py and a setup checker"'
        run: 'cd my-first-repo && git commit -m "First commit: hello.py and a setup checker"'
        keep: "1-2"
        say: >
          Aur commit. Dash m ke baad message, jo batata hai ki iss commit mein kya hai. Output mein branch, commit ka chhota ID, message, aur kitni files aayi.
      - cmd: git log --oneline
        run: cd my-first-repo && git log --oneline --decorate
        say: >
          git log history dikhata hai. Dash dash oneline, har commit ek line mein: ID aur message. Hamari history mein ek save point hai.

  - type: table
    heading: "Good commit messages"
    columns: [Avoid, Prefer, Why]
    widths: [1.3, 2.2, 1.5]
    rows:
      - {cells: ["`update`", "`Add a .env check to the setup checker`", "says **what** changed"], say: "Commit message kaise likhein? Update jaisa message kuch nahi batata. Batao kya badla."}
      - {cells: ["`fix`", "`Fix crash when requirements.txt is missing`", "says **which** problem"], say: "Sirf fix nahi. Kaunsi problem fix hui, woh likho."}
      - {cells: ["`asdf`, `final`, `changes`", "One small change per commit", "easy to review and undo"], say: "Aur ek commit mein ek chhota, saaf change. Isse review aur undo dono aasaan."}
      - {cells: ["", "Imperative, under ~60 characters", "the Git convention"], say: "Convention hai ki message order ki tarah likho, jaise Add, Fix, Remove, aur chhota rakho.", tone: teal}

  - type: terminal
    chapter: Seeing changes
    heading: "Change a file: status, diff, commit again"
    title: terminal — bash · ~/projects/my-first-repo
    cwd: tmp:projects
    alias: /home/student/projects
    steps:
      - cmd: echo "Built in Module 0 of AI Agents with Python." >> README.md
        run: cd my-first-repo && echo "Built in Module 0 of AI Agents with Python." >> README.md
        say: >
          Ab ek change karte hain. README mein ek line jodi.
      - cmd: git status --short
        run: cd my-first-repo && git status --short
        say: >
          git status ab README ke aage M dikhata hai, matlab modified. Git ko pata hai ki file badli hai.
      - cmd: git diff
        run: cd my-first-repo && git diff
        say: >
          Aur kya badla? git diff exact batata hai. Plus wali line nayi hai. Minus hoti toh hatai gayi hoti. Commit se pehle diff dekhna ek achhi aadat hai.
      - cmd: git commit -am "Say where the project comes from"
        run: cd my-first-repo && git commit -am "Say where the project comes from"
        say: >
          Commit dash a m. Dash a pehle se tracked files ki changes ko khud add kar deta hai. Nayi files ke liye git add phir bhi chahiye.
      - cmd: git log --oneline
        run: cd my-first-repo && git log --oneline --decorate
        say: >
          Ab history mein do commits. Naya commit sabse upar.

  - type: terminal
    chapter: Undo
    heading: "Undo a mistake with git restore"
    title: terminal — bash · ~/projects/my-first-repo
    cwd: tmp:projects
    alias: /home/student/projects
    steps:
      - cmd: echo "print('oops'" > hello.py
        run: cd my-first-repo && echo "print('oops'" > hello.py
        say: >
          Ab ek asli galti. Lesson ek yaad hai? Ek greater than sign file ko overwrite karta hai. Do ki jagah ek likh diya, aur hello dot py ka poora code gayab, bas ek adhoori line bachi.
      - cmd: python hello.py
        run: cd my-first-repo && python hello.py
        exit: 1
        keep: "-1"
        say: >
          Chalao, aur error. Syntax error: bracket kabhi band hi nahi hua. Bina Git ke, poora code dobara likhna padta.
      - cmd: git restore hello.py
        run: cd my-first-repo && git restore hello.py
        say: >
          Git ke saath koi tension nahi. git restore file ko aakhri commit wali haalat mein wapas le aata hai. Dhyan rahe, jo changes abhi tak commit nahi hue, woh chale jaate hain. Isliye pehle diff dekh lo.
      - cmd: python hello.py && git status
        run: cd my-first-repo && python hello.py && git status
        say: >
          Program phir se theek chalta hai, aur git status kehta hai: working tree clean, yaani koi bhi uncommitted change nahi.

  - type: diagram
    chapter: Branches
    heading: "A branch is a separate line of work"
    nodes:
      - {id: c1, label: "First commit", x: 240, y: 220, w: 280, h: 96, tone: teal}
      - {id: c2, label: "Say where...", x: 600, y: 220, w: 280, h: 96, tone: teal}
      - {id: c3, label: "Add CONTRIBUTING", sub: "branch: add-notes", x: 1000, y: 480, w: 420, h: 110, tone: amber}
      - {id: main, label: "main", sub: "after merge", x: 1440, y: 220, w: 300, h: 96, tone: violet}
    edges:
      - {from: c1, to: c2}
      - {from: c2, to: c3}
      - {from: c3, to: main}
    say: >
      Ab branches. Branch kaam ki ek alag line hai.
    steps:
      - show: [c1, c2, "c1->c2"]
        say: >
          main branch mein hamare do commits hain. main woh version hai jo hamesha chalna chahiye.
      - show: [c3, "c2->c3"]
        flow: ["c2->c3"]
        say: >
          Naya kaam, jaise ek naya feature, ek alag branch par hota hai. Wahan aap kuch bhi try kar sakte ho, main ko chhuye bina.
      - show: [main, "c3->main"]
        flow: ["c3->main"]
        focus: [main]
        say: >
          Kaam poora aur test ho gaya, toh merge karke main mein le aate ho. Teams mein yeh merge GitHub ke pull request se hota hai, jahan pehle koi aur code review karta hai.

  - type: terminal
    heading: "switch -c, commit, switch back, merge"
    title: terminal — bash · ~/projects/my-first-repo
    cwd: tmp:projects
    alias: /home/student/projects
    steps:
      - cmd: git switch -c add-notes
        run: cd my-first-repo && git switch -c add-notes
        say: >
          git switch dash c nayi branch banata hai aur usme chala jaata hai. Naam: add notes.
      - cmd: echo "Run python check_setup.py before every commit." > CONTRIBUTING.md
        run: cd my-first-repo && echo "Run python check_setup.py before every commit." > CONTRIBUTING.md
        say: >
          Ek nayi file banayi: CONTRIBUTING dot md, contributors ke liye ek note.
      - cmd: git add CONTRIBUTING.md && git commit -m "Add a CONTRIBUTING note"
        run: cd my-first-repo && git add CONTRIBUTING.md && git commit -m "Add a CONTRIBUTING note"
        say: >
          Nayi file hai, isliye pehle git add, phir commit. Yeh commit sirf add notes branch par hai.
      - cmd: git switch main && ls
        run: cd my-first-repo && git switch main && ls -C -T 0
        say: >
          Wapas main par switch kiya. ls dekho: CONTRIBUTING file yahan hai hi nahi. main abhi bhi purane jaisa hai.
      - cmd: git merge add-notes
        run: cd my-first-repo && git merge add-notes
        say: >
          Ab merge. Fast forward ka matlab: main mein beech mein koi naya commit nahi tha, toh Git ne bas main ko aage badha diya. File aa gayi.
      - cmd: git log --oneline
        run: cd my-first-repo && git log --oneline --decorate
        say: >
          History mein ab teen commits. Aur HEAD batata hai ki aap abhi kahan ho: main par.

  - type: steps
    chapter: GitHub
    heading: "Put your repository on GitHub"
    items:
      - {text: "Create a free account at **github.com**", sub: "pick a professional username: it becomes your portfolio link", say: "Ab GitHub. Pehle github dot com par free account banao. Username soch kar chuno, kyunki yeh aapke portfolio ka link banega."}
      - {text: "Click **New repository** → name it `my-first-repo`", sub: "leave README, .gitignore and license unticked: you already have them", say: "Phir New repository par click karo, naam do my first repo. README, gitignore, aur license ke box khaali chhodo, kyunki yeh files aapke paas pehle se hain."}
      - {text: "Copy its URL: `https://github.com/your-name/my-first-repo.git`", sub: "your-name = your GitHub username", say: "GitHub aapko repository ka URL dega. Usse copy karo."}
      - {text: "`git remote add origin <URL>` then `git push -u origin main`", sub: "origin = the usual name for \"my main remote\"", say: "Phir terminal mein git remote add origin aur woh URL. Origin bas ek naam hai, remote ka nickname. Phir git push."}
      - {text: "Sign in: Git Credential Manager, `gh auth login`, or an SSH key", sub: "GitHub doesn't accept your account password for git; never commit a token", tone: amber, say: "Pehli baar push par sign in karna hoga. GitHub git ke liye aapka account password nahi leta. Windows aur Mac par Git Credential Manager browser kholkar sign in kara deta hai. Ya GitHub CLI ki gh auth login command, ya SSH key. Aur token ko kabhi bhi code mein mat rakhna."}

  - type: callout
    kind: info
    label: About the demo
    title: "In this video, \"GitHub\" is a folder"
    body: "So the demo needs no account and no password, the remote below is a **bare repository in a local folder** (`fake-github/`). Git treats it exactly like GitHub: the same `remote`, `push`, `clone` and `pull` commands. With GitHub, the only difference is the URL."
    say: >
      Ek honest note. Iss video mein mai aapko apna koi account ya password nahi dikhaungi. Isliye demo mein remote ek local folder hai, fake github, jisme ek bare repository hai. Bare matlab sirf history, bina working files ke, bilkul jaise GitHub ke server par hota hai.
      Git iske saath bilkul GitHub jaisa behave karta hai. Remote, push, clone, pull, sab same commands. Farak sirf URL ka hai. Aap apne computer par GitHub wala URL use karna.

  - type: terminal
    chapter: Push
    heading: "Add a remote and push"
    title: terminal — bash · ~/projects/my-first-repo
    cwd: tmp:projects
    alias: /home/student/projects
    steps:
      - cmd: git init --bare ../fake-github/my-first-repo.git
        run: cd my-first-repo && git init --bare ../fake-github/my-first-repo.git
        say: >
          Pehle fake GitHub par khaali repository banate hain. GitHub par yeh New repository button wala step tha.
      - cmd: git remote add origin ../fake-github/my-first-repo.git
        run: cd my-first-repo && git remote add origin ../fake-github/my-first-repo.git
        say: >
          Remote jodo, naam origin. GitHub ke saath yahan aapka https wala URL hoga.
      - cmd: git remote -v
        run: cd my-first-repo && git remote -v
        say: >
          git remote dash v remotes ki list dikhata hai. Fetch matlab yahan se laana, push matlab yahan bhejna.
      - cmd: git push -u origin main
        run: cd my-first-repo && git push -u origin main
        say: >
          Aur push. main branch origin par bhej di. Dash u ek baar lagta hai: yeh main ko origin ke main se jod deta hai. Iske baad sirf git push aur git pull kaafi hai. GitHub par yahan aapka code website par dikhne lagta.

  - type: terminal
    chapter: Clone and pull
    heading: "A second laptop: clone, change, push"
    title: terminal — bash · ~/projects
    cwd: tmp:projects
    alias: /home/student/projects
    say: >
      Ab socho aapka ek doosra laptop hai, ya ek teammate. Woh project kaise lega?
    steps:
      - cmd: git clone fake-github/my-first-repo.git laptop-2
        say: >
          git clone poora repository, poori history ke saath, ek naye folder mein copy karta hai. GitHub par clone ka URL repository page ke Code button mein milta hai.
      - cmd: ls -a laptop-2
        run: ls -aC -T 0 laptop-2
        say: >
          Clone mein kya aaya? Code, tests, requirements, dot env dot example, dot gitignore. Aur kya nahi aaya? Na dot env, na dot venv. Bilkul sahi. Secrets kabhi share nahi hue, aur venv har machine apna banati hai, README ke steps se.
      - cmd: cd laptop-2 && echo "- Tested on a second laptop." >> README.md
        run: cd laptop-2 && echo "- Tested on a second laptop." >> README.md
        say: >
          Doosre laptop par ek change.
      - cmd: git commit -am "Note the second-laptop test" && git push
        run: cd laptop-2 && git commit -am "Note the second-laptop test" && git push
        say: >
          Commit aur push. Clone mein origin pehle se set hota hai, isliye bas git push.

  - type: terminal
    heading: "Back on the first laptop: git pull"
    title: terminal — bash · ~/projects/my-first-repo
    cwd: tmp:projects
    alias: /home/student/projects
    steps:
      - cmd: git pull
        run: cd my-first-repo && git pull
        say: >
          Pehle laptop par wapas. git pull remote se naye commits laata hai aur aapki branch mein jod deta hai. README mein ek line aayi.
      - cmd: git log --oneline
        run: cd my-first-repo && git log --oneline --decorate
        say: >
          Aur history mein chaar commits, doosre laptop wala bhi. Origin slash main aur aapka main ek hi commit par hain, yaani dono barabar.
    outro: >
      Roz ka workflow yahi hai. Kaam shuru karne se pehle git pull. Kaam ke baad add, commit, aur push. Ek line yaad rakho: pull, kaam, add, commit, push.

  - type: callout
    kind: warn
    title: "Pushed a secret by mistake?"
    body: "1) **Revoke the key now** in the provider's console. 2) Create a new key in your `.env`. 3) Remove the file and add it to `.gitignore`. Deleting it in a new commit is **not** enough: it is still in the history, and bots scan GitHub for keys within minutes."
    say: >
      Aur agar galti se secret push ho gaya? Pehla step, abhi, key revoke karo. Doosra, nayi key banao aur sirf dot env mein rakho. Teesra, file hatao aur gitignore mein jodo.
      Naye commit mein delete karna kaafi nahi hai, kyunki key history mein abhi bhi hai. Aur bots kuch hi minutes mein GitHub par keys dhoondh lete hain.

