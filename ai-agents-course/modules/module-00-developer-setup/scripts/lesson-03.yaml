  - type: interview
    chapter: Interview corner
    items:
      - q: "What is the difference between Git and GitHub?"
        a: "**Git** is the version control tool that runs on your computer: commits, history, branches. **GitHub** is a website that hosts Git repositories and adds collaboration: pull requests, reviews, issues."
        trap: "Saying they are the same thing, or that you need GitHub to use Git."
        say_q: "Interview corner. Pehla, sabse common question: Git aur GitHub mein kya farak hai?"
        say_a: "Answer: Git version control tool hai jo aapke computer par chalta hai: commits, history, branches. GitHub ek website hai jo Git repositories host karti hai, aur collaboration jodti hai, jaise pull requests aur reviews. Trap: dono ko ek hi cheez bolna, ya yeh kehna ki Git ke liye GitHub zaroori hai."
      - q: "Explain `git add`, `git commit` and `git push`."
        a: "`add` moves changes into the **staging area** (choose what goes in). `commit` saves the staged snapshot in the **local** history with a message. `push` sends your commits to the **remote**, like GitHub."
        trap: "Thinking `commit` uploads your work. Until you push, it exists only on your laptop."
        say_q: "Doosra: git add, git commit, aur git push explain karo."
        say_a: "Answer: add changes ko staging area mein le jaata hai, yaani chunna ki kya jaayega. Commit staged snapshot ko local history mein message ke saath save karta hai. Aur push commits ko remote par bhejta hai, jaise GitHub. Trap: sochna ki commit se kaam upload ho gaya. Push ke bina woh sirf aapke laptop par hai."
      - q: "You committed an API key and pushed it. What do you do?"
        a: "**Revoke the key immediately** and issue a new one; then remove the file, add it to `.gitignore`, and if needed clean the history. Revoking comes first because the key must be treated as already stolen."
        trap: "\"I deleted the file in the next commit.\" The key is still in the history."
        say_q: "Teesra: aapne API key commit karke push kar di. Ab kya karoge?"
        say_a: "Answer: sabse pehle key turant revoke karo aur nayi banao. Phir file hatao, gitignore mein jodo, aur zaroorat ho toh history saaf karo. Revoke pehle, kyunki key ko chori hui maan kar chalna chahiye. Trap: bolna ki agle commit mein file delete kar di. Key history mein abhi bhi hai."
      - q: "What is a merge conflict?"
        a: "When two branches change **the same lines** differently, Git can't choose for you. It marks both versions in the file; you edit it to the right result, then `add` and `commit`."
        trap: "Panicking, or deleting and re-cloning. A conflict is normal: read both sides, keep the right code."
        say_q: "Aur chautha: merge conflict kya hota hai?"
        say_a: "Answer: jab do branches same lines ko alag alag tareeke se badalti hain, Git khud decide nahi kar sakta. Woh file mein dono versions mark kar deta hai. Aap file ko sahi result tak edit karte ho, phir add aur commit. Trap: ghabra jaana, ya sab delete karke dobara clone karna. Conflict normal hai."

