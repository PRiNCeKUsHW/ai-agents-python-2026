  - type: quiz
    chapter: Quick check
    number: 1
    question: "You edited `app.py`. In which order do these commands put it on GitHub?"
    options:
      - "`git push` → `git commit` → `git add`"
      - "`git commit` → `git add` → `git push`"
      - "`git add` → `git commit` → `git push`"
      - "`git add` → `git push` → `git commit`"
    answer: 2
    explain: "Stage the change (`add`), save it in the local history (`commit`), then send the commits to the remote (`push`)."
    say_question: >
      Quick check. Aapne app dot py edit ki. GitHub tak pahunchane ke liye commands ka sahi order kya hai?
    say_answer: >
      C. Pehle add, phir commit, phir push. Pack karo, seal karo, bhejo.

  - type: quiz
    number: 2
    question: "`.env` is listed in `.gitignore`. What does `git status` show for it?"
    options:
      - "`modified: .env`"
      - "`new file: .env`"
      - "Nothing: ignored files are not listed"
      - "An error"
    answer: 2
    explain: "Ignored files don't appear in `git status`. Check why a file is ignored with `git check-ignore -v .env`."
    say_question: >
      Doosra question. Dot env gitignore mein hai. Git status uske baare mein kya dikhayega?
    say_answer: >
      C, kuch nahi. Ignored files status mein dikhti hi nahi. Kyun ignored hai, yeh git check ignore dash v batata hai.

  - type: quiz
    number: 3
    question: "A teammate pushed new commits. Which command brings them into your local `main`?"
    options:
      - "`git clone`"
      - "`git pull`"
      - "`git push`"
      - "`git init`"
    answer: 1
    explain: "`pull` fetches new commits from the remote and merges them. `clone` is only for getting a repository the first time."
    say_question: >
      Teesra. Teammate ne naye commits push kiye. Aapke local main mein kaunsi command laayegi?
    say_answer: >
      B, git pull. Clone sirf pehli baar repository lene ke liye hota hai.

