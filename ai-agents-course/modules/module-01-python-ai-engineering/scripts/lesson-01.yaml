module_title: Python for AI Engineering
title: Welcome, the Agent Loop, and Your Python Setup
narration: hinglish
scenes:
  - type: title
    chapter: Welcome
    kicker: Module 1 · Lesson 1
    title: AI Agents with Python
    subtitle: Beginner to Production, 2026. Part I starts here.
    tags: [Python, LLMs, Tools, RAG, LangGraph, FastAPI, Docker]
    say: >
      Namaste, aur swagat hai Module ek mein. Module zero mein humne terminal, virtual environment, aur Git seekha. Ab asli safar shuru hota hai.
      Iss course mein aap Python ke basic data structures se lekar, ek poora AI agent application production tak le jaoge: tools, memory, retrieval, tests, security, aur deployment ke saath.
      Aur yeh pehla lesson batata hai ki AI agent asal mein hota kya hai, course kaise chalega, aur aapka Python setup ready hai ya nahi.

  - type: objectives
    items:
      - {text: "Explain what an AI agent is, and how it differs from a chatbot", say: "Iss lesson ke baad aap explain kar paoge ki AI agent kya hai, aur chatbot se kaise alag hai."}
      - {text: "Describe the agent loop: decide, act, observe, repeat", say: "Agent loop samjhoge: decide, act, observe, aur repeat."}
      - {text: "Run a tiny agent loop written in plain Python", say: "Plain Python mein likha ek chhota sa agent loop chalaoge."}
      - {text: "Know the course map and how every module works", say: "Poore course ka map, aur har module kaise chalta hai, woh jaanoge."}
      - {text: "Check your Python setup for this module", say: "Aur iss module ke liye apna Python setup check karoge."}

  - type: callout
    chapter: What is an AI agent?
    kind: analogy
    title: "An agent is like a smart new intern"
    body: "You give an intern a **goal**, not a script: \"find the cheapest flight to Goa next Friday\". The intern **asks a senior** what to do next, **uses tools** (a browser, a phone, a spreadsheet), **looks at the result**, and keeps going until the job is done, or until you said to stop."
    say: >
      Pehle what: AI agent kya hai? Ek naya, smart intern socho. Aap usse step by step script nahi dete. Aap ek goal dete ho: agle Friday Goa ki sabse sasti flight dhoondo.
    items:
      - {text: "The intern = your Python program", say: "Intern hai aapka Python program."}
      - {text: "The senior who decides the next step = the language model", say: "Senior, jo batata hai ki agla step kya ho, woh hai language model."}
      - {text: "Browser, phone, spreadsheet = tools", say: "Browser, phone, aur spreadsheet, yeh sab tools hain."}
      - {text: "\"Stop after 20 minutes\" = a safety limit", say: "Aur aapka instruction, bees minute mein ruk jaana, woh hai safety limit."}
    outro: >
      Yaad rakhna: senior khud kuch nahi karta. Woh sirf bataata hai. Kaam intern karta hai. AI agent mein bhi model sirf decide karta hai, aur kaam aapka Python code karta hai.

  - type: diagram
    heading: What is an AI agent?
    nodes:
      - {id: user, label: You, sub: a goal, x: 170, y: 330, w: 240, tone: amber, shape: pill}
      - {id: agent, label: Agent, sub: your Python program, x: 640, y: 330, w: 320, h: 150, tone: teal}
      - {id: llm, label: Language model, sub: decides the next step, x: 1240, y: 120, w: 380, tone: violet}
      - {id: tools, label: Tools, sub: "search, files, APIs, code", x: 1240, y: 540, w: 380, tone: blue}
    edges:
      - {from: user, to: agent, label: task}
      - {from: agent, to: llm, label: "what next?"}
      - {from: llm, to: agent, label: decision, bend: 0.25}
      - {from: agent, to: tools, label: call}
      - {from: tools, to: agent, label: result, bend: -0.25}
    say: >
      Ab yahi baat ek diagram mein.
    steps:
      - show: [user, agent, "user->agent"]
        focus: [user, agent]
        say: >
          AI agent ek program hai jise goal milta hai, fixed script nahi. Aap batate ho ki kya chahiye, jaise: iss topic par research karo aur ek chhota summary likho.
      - show: [llm, "agent->llm", "llm->agent"]
        focus: [agent, llm]
        flow: ["agent->llm", "llm->agent"]
        say: >
          Program language model se poochta hai: ab kya karun? Model khud kuch run nahi karta. Woh sirf ek decision wapas bhejta hai, text ke roop mein, ya ek structured tool request ke roop mein.
      - show: [tools, "agent->tools", "tools->agent"]
        focus: [agent, tools]
        flow: ["agent->tools", "tools->agent"]
        say: >
          Phir aapka Python code woh action ek tool se karta hai. Jaise web search, database query, ya calculator. Aur result wapas model ko bhejta hai.
      - focus: [agent]
        caption: "Decide, act, observe, repeat, until done or a limit is reached"
        say: >
          Yeh ek loop mein chalta hai. Decide, act, observe, aur phir se. Jab tak goal poora na ho, ya koi safety limit na rok de.
          Yahi loop iss course ke har agent ka dil hai. Module chaar mein aap isse bilkul shuru se banaoge.

  - type: compare
    heading: "Chatbot vs agent"
    left:
      title: "Chatbot"
      tone: blue
      label: Answers
      items:
        - "One question in, one text answer out"
        - "Only knows what it was trained on"
        - "Can't do anything outside the chat"
        - "Example: \"What is a refund policy?\""
    right:
      title: "AI agent"
      tone: teal
      label: Acts
      items:
        - "A goal in, several steps until it's done"
        - "Looks things up with tools"
        - "Takes actions: search, read files, call APIs"
        - "Example: \"Find my order and start the refund\""
    steps:
      - show: left
        say: >
          Ab ek important farak: chatbot aur agent. Chatbot ek sawaal leta hai aur ek text jawaab deta hai. Jo uski training mein tha, bas wahi jaanta hai, aur chat ke bahar kuch nahi kar sakta.
      - show: right
        say: >
          Agent ko goal milta hai, aur woh kai steps leta hai. Tools se cheezein dhoondhta hai, files padhta hai, APIs call karta hai. Chatbot bataata hai ki refund policy kya hai. Agent aapka order dhoondh kar refund shuru kar deta hai.

  - type: table
    chapter: Where agents are used
    heading: "Where agents are used today"
    columns: [Area, The goal, Tools it uses]
    widths: [1.1, 2, 2]
    rows:
      - {cells: ["Customer support", "solve a ticket", "order database, refund API"], say: "Ab where: agents kahan use hote hain? Customer support mein: ticket solve karna, order database aur refund API ke saath."}
      - {cells: ["Coding", "fix a failing test", "read files, run tests, edit code"], say: "Coding mein: ek failing test theek karna. Agent files padhta hai, tests chalata hai, aur code edit karta hai."}
      - {cells: ["Research", "write a short brief", "web search, PDF reader"], say: "Research mein: ek chhota brief likhna, web search aur PDF reader ke saath."}
      - {cells: ["Data", "answer a business question", "SQL queries, charts"], say: "Aur data mein: business ka koi sawaal answer karna, SQL queries aur charts se.", tone: teal}
    outro: >
      Inn sab mein pattern ek hi hai: goal, model ka decision, tool ka action, aur result. Iss course mein aap inme se kai agents khud banaoge.

  - type: run
    chapter: A tiny agent loop
    heading: "The agent loop in 30 lines of Python"
    title: agent_loop.py
    file: source/lesson-01/agent_loop.py
    cwd: source/lesson-01
    cmd: python agent_loop.py
    say: >
      Ab how: loop asal mein dikhta kaisa hai? Yeh tees lines ka Python program hai. Goal hai: twenty three into nineteen, plus seven, kitna hota hai?
      Dhyaan do: yahan model ek fake hai. Do fixed rules, real language model nahi. Real model Module do mein aayega. Abhi sirf loop samajhna hai.
    steps:
      - lines: "4-10"
        note: "`fake_model` decides the next step. Not a real LLM: two fixed rules."
        say: >
          Pehla function, fake model. Yeh decide karta hai ki agla step kya ho. Agar abhi tak koi note nahi hai, toh calculator se twenty three into nineteen karwao. Ek note hai, toh usme saat jodo. Warna finish.
      - lines: "13-16"
        note: "`calculator` is the tool: it actually does the work."
        say: >
          Doosra function, calculator. Yeh tool hai. Kaam yahi karta hai: do numbers aur ek operator leta hai, aur result deta hai.
      - lines: "19-22"
        note: "The loop: at most `max_steps` rounds. Step 1 = decide."
        say: >
          Ab asli cheez, run agent. Ek for loop, zyaada se zyaada paanch steps. Har step mein pehle decide: model se poocho ki ab kya karna hai.
      - lines: "26-28"
        out: "1-2"
        note: "Step 2 = act (call the tool), step 3 = observe (keep the result)."
        say: >
          Phir act: tool ko call karo. Aur observe: result ko notes mein rakh lo, taaki agli baar model use dekh sake. Right side par dekho: step ek mein four thirty seven, step do mein four forty four.
      - lines: "23-25"
        out: "3-4"
        note: "The model says finish: the loop ends with the answer."
        say: >
          Step teen mein model kehta hai finish. Loop answer return karta hai: four forty four.
      - lines: "29"
        note: "Safety limit: never loop forever."
        say: >
          Aur aakhri line bahut important hai. Agar paanch steps mein kaam poora na ho, toh loop ruk jaata hai. Real agents mein yeh safety limit zaroori hai, warna galti se ek agent hamesha chalta reh sakta hai, aur API ka bill badhta rahega.

  - type: callout
    kind: tip
    title: "Pause and try"
    body: "Change the goal's numbers in `fake_model` (for example `12 * 12` and `+ 1`), run it again, and predict the output before you press Enter."
    say: >
      Pause and try. fake model mein numbers badlo, jaise twelve into twelve, plus ek. Enter dabane se pehle output guess karo.
    items:
      - {text: "Then set `max_steps=2`. What happens?", say: "Phir max steps ko do kar do. Kya hoga? Socho, phir chala ke dekho.", pause: 5}

