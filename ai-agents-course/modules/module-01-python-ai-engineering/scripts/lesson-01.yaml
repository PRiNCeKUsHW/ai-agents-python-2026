  - type: interview
    chapter: Interview corner
    items:
      - q: "What is the difference between a chatbot and an AI agent?"
        a: "A chatbot answers a message with text. An **agent** works towards a goal in a **loop**: the model decides the next step, the program runs a tool, and the result goes back to the model, until the goal is met or a limit stops it."
        trap: "Saying \"an agent is a smarter model\". The model can be the same; the loop and the tools make it an agent."
        say_q: "Interview corner. Pehla question: chatbot aur AI agent mein kya farak hai?"
        say_a: "Answer: chatbot ek message ka text mein jawaab deta hai. Agent ek goal ki taraf loop mein kaam karta hai: model agla step decide karta hai, program tool chalata hai, aur result wapas model ko jaata hai. Trap: yeh kehna ki agent ek smarter model hai. Model wahi ho sakta hai. Loop aur tools usse agent banate hain."
      - q: "Does the language model run the tools itself?"
        a: "No. The model only returns a **decision** (text or a structured tool request). **Your code** validates it and runs the tool, then sends the result back."
        trap: "Trusting the model's request blindly. Your code is where permissions and checks live."
        say_q: "Doosra question: kya language model tools khud chalata hai?"
        say_a: "Answer: nahi. Model sirf ek decision lautaata hai. Aapka code usse check karta hai, tool chalata hai, aur result wapas bhejta hai. Trap: model ki request par aankh band karke bharosa karna. Permissions aur checks aapke code mein hote hain."
      - q: "Why does every agent loop need a step limit?"
        a: "A model can repeat itself or never say \"finish\". A **max-steps** limit (and often a time or cost limit) stops runaway loops and runaway API bills."
        trap: "Writing `while True:` around model calls."
        say_q: "Teesra question: har agent loop mein step limit kyun chahiye?"
        say_a: "Answer: model khud ko repeat kar sakta hai, ya kabhi finish bole hi nahi. Max steps ki limit, aur aksar time ya cost ki limit bhi, aise bhaagte loops aur bhaagte API bills ko rokti hai. Trap: model calls ke chaaron taraf while True likh dena."

