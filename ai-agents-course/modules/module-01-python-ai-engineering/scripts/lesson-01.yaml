  - type: quiz
    chapter: Quick check
    number: 1
    question: "In an AI agent, who actually runs the tool (for example, the calculator)?"
    options:
      - "The language model"
      - "Your Python code"
      - "The user"
      - "The operating system, automatically"
    answer: 1
    explain: "The model only decides. Your code calls the tool and sends the result back."
    say_question: >
      Quick check. AI agent mein tool, jaise calculator, asal mein kaun chalata hai?
    say_answer: >
      B, aapka Python code. Model sirf decide karta hai.

  - type: quiz
    number: 2
    question: "Which command records the exact package versions of your venv?"
    options:
      - "`pip list`"
      - "`pip freeze > requirements.txt`"
      - "`python -m venv .venv`"
      - "`pip install -r requirements.txt`"
    answer: 1
    explain: "`pip freeze` prints `name==version` lines; redirecting them makes `requirements.txt`. `install -r` is the other direction: it rebuilds from the file."
    say_question: >
      Doosra question. Kaunsi command aapke venv ke exact package versions record karti hai?
    say_answer: >
      B, pip freeze, requirements dot txt mein. Aur pip install dash r ulta kaam karta hai: file se environment dobara banata hai.

  - type: recap
    chapter: Recap
    heading: Lesson 1 recap
    items:
      - {text: "An agent works towards a goal: decide, act, observe, repeat", say: "Recap. Agent ek goal ki taraf kaam karta hai: decide, act, observe, aur repeat."}
      - {text: "The model decides; your Python code acts", say: "Model sirf decide karta hai. Kaam aapka Python code karta hai."}
      - {text: "Every loop needs a safety limit", say: "Har loop mein ek safety limit zaroori hai."}
      - {text: "20 modules in 7 parts; Python is the shared language of AI", say: "Bees modules, saat parts. Aur Python AI ki common bhaasha hai."}
      - {text: "One virtual environment per project, versions pinned", say: "Har project ka apna virtual environment, pinned versions ke saath."}
    outro: >
      Agle lesson mein hum asli Python likhenge: woh data types jinse har AI application bani hoti hai.

