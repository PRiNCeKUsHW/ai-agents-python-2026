  - type: terminal
    chapter: Your setup check
    heading: "Setup check: Python, a venv and one package"
    title: terminal — ai-toolkit
    cwd: tmp
    alias: ~/ai-toolkit
    say: >
      Ab ek quick setup check. Yeh sab Module zero mein detail mein kiya tha, isliye yahan jaldi se. Ek khaali folder mein terminal kholo.
    steps:
      - cmd: python3 --version
        say: >
          Pehle Python ka version. Windows par aksar sirf python, ya py. Three point eleven se upar kuch bhi chalega.
      - cmd: python3 -m venv .venv
        say: >
          Phir virtual environment. Har project ka apna, taaki ek project ki libraries doosre ko kabhi na todein.
      - cmd: source .venv/bin/activate && which python
        run: . .venv/bin/activate && which python
        prompt: "(.venv) $"
        say: >
          Activate karo. Mac aur Linux par source dot venv slash bin slash activate. Windows par dot venv backslash Scripts backslash activate. Ab python command aapke project folder ke andar wala Python hai.
      - cmd: pip install httpx==0.28.1
        run: . .venv/bin/activate && pip install --disable-pip-version-check httpx==0.28.1
        keep: "1,-1"
        prompt: "(.venv) $"
        say: >
          Environment active hai, toh pip packages isi mein install karega. Hum httpx install karte hain, HTTP library jo lesson paanch mein use hogi. Aur exact version pin karte hain, taaki aapka result mere jaisa hi aaye.
      - cmd: pip freeze > requirements.txt && head -3 requirements.txt
        run: . .venv/bin/activate && pip freeze > requirements.txt && head -3 requirements.txt
        prompt: "(.venv) $"
        say: >
          Aur pip freeze exact versions ko requirements file mein likh deta hai. Koi bhi pip install dash r requirements dot txt se wahi environment dobara bana sakta hai.

  - type: callout
    kind: warn
    title: "Seeing \"externally-managed-environment\" or packages in the wrong place?"
    body: "pip is not running inside your virtual environment. Activate `.venv` first, then check with `which python` (macOS/Linux) or `where python` (Windows)."
    say: >
      Ek warning. Agar pip externally managed environment ki shikayat kare, ya packages gaayab lagein, toh aap lagbhag pakka virtual environment ke bahar ho. Dobara activate karo, aur which python, ya Windows par where python, se check karo ki woh project folder ke andar point kar raha hai.

