      │   ├── models.py  loader.py  stats.py  report.py ...
      └── tests/              # automated tests with pytest
    say: >
      Yeh project ka layout hai, jismein hum module ke end tak pahunchenge.
    steps:
      - lines: "2-4"
        say: >
          Upar: virtual environment, jo kabhi commit nahi hota. Settings ka template, bina secrets ke. Aur pinned requirements.
      - lines: "5-6"
        say: >
          Configuration aur sample data apne alag folders mein.
      - lines: "7-10"
        say: >
          Asli code ek package mein hai, jiska naam toolkit hai. Special file dunder main ki wajah se hum poore package ko python dash m toolkit se chala sakte hain.
      - lines: "11"
