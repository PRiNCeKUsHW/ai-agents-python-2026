module_title: Python for AI Engineering
title: "Python Core Data: Variables, Lists, Dictionaries and Sets"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 1 · Lesson 2
    title: The data every AI app is made of
    subtitle: Variables, strings, lists, dictionaries and sets, in the shapes real AI code uses.
    say: >
      Har AI application, ek simple chatbot se lekar agents ki poori team tak, wahi kuch tarah ka data idhar udhar karti hai. Text, numbers, messages ki lists, aur settings ki dictionaries.
      Iss lesson mein aap yeh building blocks theek se seekhoge, bilkul usi shape mein jo language model APIs use karti hain.

  - type: objectives
    items:
      - {text: "Create variables and recognise the basic types", say: "Iss lesson ke baad aap variables bana paoge, aur Python ke basic types pehchaan paoge."}
      - {text: "Build text with f-strings", say: "f strings se saaf text banaoge."}
      - {text: "Use lists, dictionaries and sets, and know when to pick each", say: "Lists, dictionaries, aur sets use karoge, aur jaanoge ki kab kaunsa chunna hai."}
      - {text: "Build a chat conversation as a list of dictionaries", say: "Aur ek chat conversation ko dictionaries ki list ki tarah banaoge. Yahi format Module do mein model ko bheja jaayega."}

  - type: callout
    chapter: Variables and types
    kind: analogy
    title: "A variable is a label on a jar"
    body: "In a kitchen, jars carry labels: **sugar**, **salt**, **chai patti**. The label is the **name**, what's inside is the **value**, and the kind of thing inside is the **type**. You can move a label to a new jar any time."
    say: >
      Pehle what: variable kya hai? Rasoi ke dabbe socho. Har dabbe par label hota hai: cheeni, namak, chai patti.
      Label variable ka naam hai. Andar jo hai, woh value hai. Aur andar kis tarah ki cheez hai, woh type hai. Aur label ko aap kabhi bhi naye dabbe par chipka sakte ho.

  - type: cards
    heading: Python's basic types
    say: >
      Python mein har value ka ek type hota hai, aur type decide karta hai ki aap uske saath kya kar sakte ho.
    cards:
      - {tag: str, title: Text, code: '"model-small"', tone: teal, say: "String, yaani s t r, text rakhta hai. Prompts, model ke naam, aur replies, sab strings hain."}
      - {tag: int, title: Whole numbers, code: "500", tone: blue, say: "int ek poora number hai, jaise token count."}
      - {tag: float, title: Decimals, code: "0.2", tone: violet, say: "float decimal number hai, jaise temperature setting, ya price."}
      - {tag: bool, title: True or False, code: "False", tone: amber, say: "bool ya toh True hota hai, ya False. Capital T aur capital F ke saath."}
      - {tag: None, title: No value yet, code: "None", tone: coral, say: "Aur None ka matlab: abhi koi value nahi. Optional cheezon ke liye, ya jo abhi load nahi hui."}

  - type: run
    heading: "variables.py: names, types and f-strings"
    title: variables.py
    file: source/lesson-02/variables.py
    cwd: source/lesson-02
    cmd: python variables.py
    say: >
      Ab how: ek chhoti script. Left mein code, right mein uska real output.
    steps:
      - lines: "2-6"
        note: "`=` assigns: the name on the left now points at the value on the right."
        say: >
          Har line equals sign se ek variable banati hai. Type aapko khud nahi batana padta. Python value dekh kar samajh leta hai.
      - lines: "8"
        out: "1"
        note: "`type()` tells you what kind of value a name points at."
        say: >
          Built in type function batata hai ki value kis type ki hai. Jab kuch ajeeb behave kare, tab yeh bahut kaam aata hai. Output mein: str, int, aur float.
      - lines: "9"
        out: "2"
        note: "An **f-string** puts values inside `{curly braces}` straight into text."
        say: >
          Yeh f string hai. Quotes se pehle f lagao, aur curly braces ke andar jo bhi hai, uski value text mein aa jaati hai. Prompts aap hamesha aise hi banaoge.
      - lines: "11-12"
        out: "3"
        note: "`:,` inside the braces adds thousands separators."
        say: >
          Variable ko kabhi bhi nayi value di ja sakti hai. Yahan max tokens chaar guna ho gaya. Aur braces ke andar colon comma lagane se hazaar ke baad comma aata hai: two comma zero zero zero.

  - type: terminal
    heading: "The first error you'll meet: str + int"
    title: terminal — lesson-02
    cwd: source/lesson-02
    steps:
      - cmd: "python -c 'print(\"Tokens: \" + 500)'"
        exit: 1
        say: >
          Ab ek classic galti. String aur number ko plus se jodna. Python TypeError deta hai, kyunki woh guess nahi karta ki text aur number ko kaise milaana hai.
    outro: >
      Fix: f string use karo, ya number ko pehle s t r se text banao. Aur kisi bhi error ki aakhri line sabse pehle padho. Wahi problem ka naam batati hai.

  - type: callout
    chapter: Lists
    kind: analogy
    title: "A list is a queue at a ticket counter"
    body: "People in a railway queue have an **order**: first, second, third. New people join **at the end**. You can point at \"the first person\" or \"the last person\". That's a list."
    say: >
      Ab lists. Railway ticket counter ki line socho. Logon ka ek order hota hai: pehla, doosra, teesra. Naya aadmi line ke end mein judta hai. Aur aap pehle ya aakhri insaan ki taraf ishara kar sakte ho. Yahi list hai.

  - type: run
    heading: "Lists: ordered collections"
    title: lists.py
    file: source/lesson-02/lists.py
    cwd: source/lesson-02
    cmd: python lists.py
    steps:
      - lines: "2"
        note: "Square brackets create a list."
        say: >
          Square brackets se list banti hai. Yahan teen user messages.
      - lines: "3-5"
        out: "1-3"
        note: "Indexes start at **0**. Negative indexes count from the end."
        say: >
          Item ko uski position se padhte hain, jise index kehte hain. Index zero se shuru hota hai, toh zero pehla item hai, aur minus ek aakhri. len function items ki ginti deta hai: teen.
      - lines: "7-8"
        out: "4"
        note: "A slice `[1:3]` includes index 1, but **stops before** index 3."
        say: >
          append end mein jodta hai. Aur slice ek range leta hai. Ek colon teen ka matlab: index ek se shuru, aur index teen se pehle ruk jao.
      - lines: "10-11"
        out: "5-8"
        note: "`enumerate` gives you a counter **and** the item."
        say: >
          for loop har item par jaata hai. enumerate saath mein ek ginti bhi deta hai, jahan se aap chaho wahan se. Dekho, Bye bhi end mein aa gaya.

  - type: callout
    chapter: Dictionaries
    kind: analogy
    title: "A dictionary is your phone's contact list"
    body: "You don't find a friend by **position** (\"the 47th contact\"). You search by **name** and get the number. Name = **key**, number = **value**."
    say: >
      Ab dictionaries. Iss poore course mein yeh sabse important structure hai. Apne phone ki contact list socho. Aap dost ko position se nahi dhoondhte, ki saintaalisvaan contact. Naam se search karte ho, aur number mil jaata hai. Naam key hai, number value hai.

  - type: run
    heading: "Dictionaries: look things up by key"
    title: dicts.py
    file: source/lesson-02/dicts.py
    cwd: source/lesson-02
    cmd: python dicts.py
    steps:
      - lines: "2-3"
        out: "1"
        note: "This is exactly the shape of a chat message sent to a language model API."
        say: >
          Yeh dictionary ek chat message hai. role batata hai ki kaun bol raha hai, aur content text hai. Real chat APIs bilkul yahi shape use karti hain. Square brackets mein key likh kar value padhte hain: user.
      - lines: "4-6"
        out: "2-3"
        note: "`.get(key, default)` never raises an error for a missing key."
        say: >
          Nayi key par value assign karne se woh jud jaati hai. Aur get method padhne ka safe tareeka hai. Key na mile, toh error ki jagah default milta hai: unknown.
      - lines: "8-12"
        note: "A **list of dictionaries** = a conversation."
        say: >
          Ab dono ko milao. Message dictionaries ki ek list, ek poori conversation hai: system instruction, user ka sawaal, aur assistant ka jawaab. Module do mein model ko bilkul yahi bhejoge.
      - lines: "13-14"
        out: "4-6"
        note: "`:>9` pads the role to 9 characters, so the columns line up."
        say: >
          Loop chalane par, f string har role ko nau characters tak right align karta hai, toh output ekdum line mein dikhta hai.

  - type: terminal
    heading: "The most common error: KeyError"
    title: terminal — lesson-02
    cwd: source/lesson-02
    steps:
      - cmd: "python -c 'm = {\"role\": \"user\"}; print(m[\"content\"])'"
        exit: 1
        say: >
          Aur yeh error aap sabse zyaada dekhoge: KeyError. Iss dictionary mein content key hai hi nahi.
    outro: >
      Jab key missing ho sakti hai, toh get ke saath ek sensible default use karo. Jab key honi hi chahiye, toh khud check karo aur saaf message do. Project mein hum yahi karenge.

  - type: callout
    chapter: Sets
    kind: analogy
    title: "A set is a wedding guest list"
    body: "A name appears on the guest list **once**, however many relatives suggest it. At the gate, the only question is **\"is this name on the list?\"**, and that check is instant."
    say: >
      Ab sets. Shaadi ki guest list socho. Kitne bhi rishtedaar ek hi naam bolein, list mein woh naam ek hi baar likha jaata hai. Aur gate par sirf ek sawaal hota hai: kya yeh naam list mein hai? Aur yeh check turant hota hai.

  - type: run
    heading: "Sets: unique items, fast membership"
    title: sets.py
    file: source/lesson-02/sets.py
    cwd: source/lesson-02
    cmd: python sets.py
    steps:
      - lines: "2-5"
        out: "1-2"
        note: "Duplicates disappear. Sets are unordered, so sort them for display."
        say: >
          Tags ki list ko set banane se duplicates hat jaate hain. Set ka koi order nahi hota, isliye print karne se pehle sorted lagaate hain, taaki output hamesha ek jaisa aaye. Teen unique tags.
      - lines: "6"
        out: "3"
        note: "`in` on a set is fast, even with millions of items."
        say: >
          in operator check karta hai ki item set mein hai ya nahi. Set kitna bhi bada ho, yeh check fast rehta hai. Answer: True.
      - lines: "8-10"
        out: "4"
        note: "Set difference: requested but **not allowed**. Remember this for agent security."
        say: >
          Sets ganit jaise operations bhi karte hain. Agent ne jo tools maange, unme se allowed tools ghatao, toh bachta hai forbidden request: delete files. Yeh idea yaad rakhna. Tool allowlists security module mein wapas aayengi.

  - type: run
    chapter: Comprehensions
    heading: "Comprehensions: a new collection in one line"
    title: comprehensions.py
    file: source/lesson-02/comprehensions.py
    cwd: source/lesson-02
    cmd: python comprehensions.py
    say: >
      Iss lesson ka aakhri tool: comprehensions. Yeh ek collection se nayi list ya dictionary, ek hi readable line mein banate hain.
    steps:
      - lines: "2-6"
        note: "Three request records: a list of dictionaries, like a usage log."
        say: >
          Yeh teen request records hain. Dictionaries ki list, bilkul ek usage log jaisi. Project mein yahi data aayega.
      - lines: "7-8"
        out: "1"
        note: "`[expression for item in items if condition]`"
        say: >
          Yeh list comprehension lagbhag English jaisa padhta hai: r ka id lo, har r ke liye records mein, agar r ka status ok hai. Do ids milte hain.
      - lines: "10-11"
        out: "2"
        note: "`{key: value for item in items}` builds a dictionary."
        say: >
          Curly braces mein key, colon, value likho, toh dictionary banti hai. Yahan har id se uske tokens.
      - lines: "13"
        out: "3"
        note: "Without brackets, it feeds straight into `sum()`."
        say: >
          Aur bina brackets ke, wahi pattern seedha sum jaise function mein ja sakta hai. Total eight hundred fifty tokens.

  - type: table
    chapter: Choosing a structure
    heading: Which structure should I use?
    columns: [Use, When, Example]
    widths: [0.8, 2, 1.8]
    rows:
      - {cells: ["list", "order matters: messages, plan steps", "`[\"Hi\", \"Bye\"]`"], say: "Ab where: kab kya use karein? List tab, jab order zaroori ho. Jaise conversation ke messages, ya plan ke steps."}
      - {cells: ["dict", "look up by name: a message, a config, a JSON record", "`{\"role\": \"user\"}`"], say: "Dictionary tab, jab naam se dhoondhna ho. Jaise ek message, configuration, ya JSON file ka record."}
      - {cells: ["set", "unique items, fast \"is it in?\": allowed tools, seen IDs", "`{\"search\", \"calc\"}`"], say: "Set tab, jab unique items chahiye, ya fast membership check. Jaise allowed tools, ya jo IDs pehle process ho chuke."}
      - {cells: ["tuple", "a fixed group that won't change: (tag, count)", "`(\"support\", 3)`"], say: "Aur tuple, round brackets wala, ek fixed group hai jo badalta nahi. Jaise ek tag aur uski ginti.", tone: teal}

  - type: interview
    chapter: Interview corner
    items:
      - q: "What is the difference between a list and a tuple?"
        a: "A **list** is mutable: you can append, remove and change items. A **tuple** is immutable: once made, it can't change. Tuples can be dictionary keys and set items; lists can't."
        trap: "Saying tuples are \"faster lists\". The real difference is mutability, and what that allows."
        say_q: "Interview corner. Pehla question: list aur tuple mein kya farak hai?"
        say_a: "Answer: list mutable hai, aap items jod, hata, aur badal sakte ho. Tuple immutable hai, ek baar bana toh badal nahi sakta. Isliye tuple dictionary ki key ban sakta hai, list nahi. Trap: kehna ki tuple bas tez list hai. Asli farak mutability ka hai."
      - q: "`d[\"k\"]` or `d.get(\"k\")`: which one, and when?"
        a: "Use `d[\"k\"]` when the key **must** exist: a missing key is a bug, and the `KeyError` says so. Use `d.get(\"k\", default)` when the key is **optional**."
        trap: "Using `.get()` everywhere, which hides real bugs behind `None`."
        say_q: "Doosra question: d square bracket k, ya d dot get k? Kab kaunsa?"
        say_a: "Answer: jab key honi hi chahiye, tab square brackets. Missing key ek bug hai, aur KeyError yahi batata hai. Jab key optional ho, tab get ek default ke saath. Trap: har jagah get lagana. Asli bugs None ke peeche chhup jaate hain."
      - q: "Why is checking `x in my_set` faster than `x in my_list`?"
        a: "A set uses hashing, so a membership check takes about the same time however big it is. A list is checked **item by item**, so it gets slower as it grows."
        trap: "Converting a list to a set inside a loop, every time: the conversion itself is the slow part."
        say_q: "Teesra: x in set, x in list se fast kyun hai?"
        say_a: "Answer: set hashing use karta hai, toh check ka time size par lagbhag depend nahi karta. List mein ek ek item check hota hai, toh list badi hone par slow hota hai. Trap: loop ke andar har baar list ko set banana. Wahi conversion slow hai."

  - type: callout
    chapter: Practice
    kind: practice
    title: "Try these before the next lesson"
    body: "Easy to hard. Answers are in the module's quiz.md."
    say: >
      Practice time. Video pause karo, aur khud try karo.
    items:
      - {text: "Print `Model: model-small | Tokens: 1,500` with one f-string", say: "Pehla: ek hi f string se print karo: Model, model small, aur Tokens, one comma five zero zero."}
      - {text: "Add a 4th message to `conversation` in `dicts.py` and print only the `user` messages", say: "Doosra: dicts dot py ki conversation mein chautha message jodo, aur sirf user wale messages print karo."}
      - {text: "From the `records` list, build a set of all statuses", say: "Teesra: records list se saare statuses ka ek set banao."}
      - {text: "Scenario: a tool list has duplicates and an unknown tool. Find both with sets.", say: "Aur scenario: tools ki ek list mein duplicates bhi hain aur ek unknown tool bhi. Sets se dono dhoondho.", pause: 6}

  - type: quiz
    chapter: Quick check
    number: 1
    question: "What does this code print?"
    code: |
      message = {"role": "user", "content": "Hi"}
      print(message.get("model", "unknown"))
    options: ["`None`", "`unknown`", "A `KeyError`", "`model`"]
    answer: 1
    explain: "`.get()` returns the default, `\"unknown\"`, when the key is missing. Only `message[\"model\"]` would raise a `KeyError`."
    say_question: >
      Quick check. Yeh code kya print karega? Zaroorat ho toh video pause karo.
    say_answer: >
      Answer: unknown. Key missing hai, toh get default lautaata hai. Sirf square brackets KeyError dete.

  - type: quiz
    number: 2
    question: "`messages = [\"a\", \"b\", \"c\", \"d\"]`. What is `messages[1:3]`?"
    options: ["`[\"a\", \"b\", \"c\"]`", "`[\"b\", \"c\"]`", "`[\"b\", \"c\", \"d\"]`", "`[\"c\", \"d\"]`"]
    answer: 1
    explain: "A slice starts at index 1 (`\"b\"`) and **stops before** index 3, so it's `[\"b\", \"c\"]`."
    say_question: >
      Doosra question. messages mein a, b, c, d hain. messages ek colon teen kya dega?
    say_answer: >
      B: b aur c. Slice index ek se shuru hota hai, aur index teen se pehle ruk jaata hai.

  - type: recap
    chapter: Recap
    heading: Lesson 2 recap
    items:
      - {text: "Variables are labels on values; `type()` reveals the type", say: "Recap. Variables values par lage labels hain, aur type function batata hai ki value kya hai."}
      - {text: "f-strings build text: `f\"{model} with {max_tokens:,} tokens\"`", say: "f strings text banane ka saaf tareeka hain, aur numbers ko format bhi karte hain."}
      - {text: "Lists keep order, dicts look up by key, sets keep things unique", say: "List order rakhti hai, dictionary key se dhoondhti hai, aur set cheezon ko unique rakhta hai."}
      - {text: "A conversation is a list of `{\"role\", \"content\"}` dicts", say: "Aur ek conversation dictionaries ki list hai, har ek mein role aur content."}
    outro: >
      Agle lesson mein: functions, classes, aur exceptions. Taaki iss data ko reusable aur reliable code mein organise kar sako.

  - type: title
    chapter: Next up
    kicker: Coming next · Module 1 · Lesson 3
    title: Functions, classes and exceptions
    subtitle: Organise your data into reusable, reliable code.
    say: >
      Lesson do complete. Ab aap AI apps ka core data samajhte ho. Milte hain agle lesson mein.
