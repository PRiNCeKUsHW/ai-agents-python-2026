module_title: Python for AI Engineering
title: "Project, Part 1: Plan, Data Model and Validation"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 1 · Lesson 6 · Project
    title: "Build the Python AI Toolkit, part 1"
    subtitle: Plan the tool, model the data, and validate every record.
    loop: [Plan, Model, Validate, Report]
    say: >
      Ab banane ka time. Agle do lessons mein aap Python AI Toolkit ko khaali folder se lekar ek tested command line tool tak le jaoge.
      Iss module ka har concept isme kahin na kahin aata hai. Iss lesson mein hum plan karenge, data ka model banayenge, aur use validate karenge.

  - type: bullets
    chapter: What we are building
    heading: "The brief: what the tool must do"
    say: >
      Har AI team ko apne language model usage ke baare mein kuch simple sawaalon ke jawaab chahiye. Kitni requests fail hui? Kitne tokens lage? Lagbhag kitna kharcha hua? Hamara tool yeh karega.
    items:
      - {text: "Read a JSON log of model API calls", sub: "one record per request: model, tokens, latency, status, tags", say: "Model API calls ka JSON log padhna, har request ka ek record."}
      - {text: "Validate every record and explain each problem", sub: "never crash on bad data", say: "Har record validate karna, aur har problem saaf batana. Kharab data par kabhi crash nahi."}
      - {text: "Summarise: success rate, tokens, cost, latency, top tags", say: "Achhe records ka summary: success rate, tokens, estimated cost, latency, aur sabse common tags."}
      - {text: "Write the report as Markdown or JSON", sub: "to the screen or to a file", say: "Report Markdown mein, logon ke liye, ya JSON mein, doosre programs ke liye."}
      - {text: "Download logs from URLs, concurrently", say: "Kai URLs se logs ek saath download karna."}
      - {text: "Configure with environment variables; test everything", say: "Settings environment variables se, aur sab kuch ke automated tests."}

  - type: diagram
    chapter: Architecture
    heading: "Architecture: small modules, one job each"
    nodes:
      - {id: cli, label: cli.py, sub: commands & arguments, x: 864, y: 60, w: 340, h: 110, tone: amber, mono: true}
      - {id: loader, label: loader.py, sub: read + validate, x: 160, y: 320, w: 280, h: 110, tone: blue, mono: true}
      - {id: stats, label: stats.py, sub: summarize(), x: 512, y: 320, w: 280, h: 110, tone: teal, mono: true}
      - {id: report, label: report.py, sub: Markdown / JSON, x: 864, y: 320, w: 280, h: 110, tone: teal, mono: true}
      - {id: config, label: config.py, sub: env vars + prices, x: 1216, y: 320, w: 280, h: 110, tone: violet, mono: true}
      - {id: fetch, label: fetch.py, sub: async downloads, x: 1568, y: 320, w: 280, h: 110, tone: violet, mono: true}
      - {id: models, label: models.py, sub: UsageRecord, x: 160, y: 540, w: 280, h: 110, tone: blue, mono: true}
      - {id: errors, label: errors.py, sub: "ToolkitError, raised anywhere", x: 864, y: 540, w: 420, h: 110, tone: coral, mono: true}
    edges:
      - {from: cli, to: loader}
      - {from: loader, to: models}
      - {from: cli, to: stats}
      - {from: cli, to: report}
      - {from: cli, to: config}
      - {from: cli, to: fetch}
    say: >
      Code likhne se pehle decide karo ki usse kaise baantna hai. Ek restaurant ki kitchen jaise: ek sabzi kaatta hai, ek pakaata hai, ek plate sajata hai. Har file ka ek kaam.
    steps:
      - show: [cli]
        focus: [cli]
        say: >
          Sabse upar cli dot py. Yeh command line padhta hai aur baaki sabko call karta hai. Sirf yahi hissa arguments aur printing ke baare mein jaanta hai.
      - show: [loader, models, "cli->loader", "loader->models"]
        focus: [loader, models]
        flow: ["cli->loader", "loader->models"]
        say: >
          loader file padhta hai, aur models har raw dictionary ko ek validated usage record banata hai.
      - show: [stats, report, "cli->stats", "cli->report"]
        focus: [stats, report]
        flow: ["cli->stats", "cli->report"]
        say: >
          stats summary calculate karta hai, aur report use format karta hai. Calculate karna aur format karna alag hain, toh dono ko test karna aasaan hai.
      - show: [config, fetch, "cli->config", "cli->fetch"]
        focus: [config, fetch]
        say: >
          config settings aur prices padhta hai, aur fetch HTTP par logs download karta hai.
      - show: [errors]
        focus: [errors]
        caption: "Every module raises ToolkitError, the CLI catches it once"
        say: >
          Aur errors hamari exception classes define karta hai. Koi bhi module ToolkitError raise kar sakta hai, aur command line usse sirf ek jagah pakadti hai.

  - type: code
    chapter: The data
    heading: "The input: a JSON usage log"
    title: data/usage_sample.json
    lang: json
    file: project/python-ai-toolkit/data/usage_sample.json
    lines: "1-14"
    say: >
      Yeh input hai. Ek JSON list, har model call ka ek object.
    steps:
      - lines: "3-6"
        say: >
          Har record mein ek id hai, use hua model, aur prompt aur completion tokens. Prompt tokens woh hain jo aapne bheje, completion tokens woh jo model ne banaye. Providers inki keemat aksar alag rakhte hain.
      - lines: "7-13"
        say: >
          Usme milliseconds mein latency bhi hai, ok ya error status, task batane wale tags ki list, aur ISO eight six zero one format mein timestamp. Isi file mein aage, request chaar tees second ke baad fail hui, jo timeout jaisa lagta hai. Asli logs mein bilkul aisi hi gadbad hoti hai.

  - type: code
    chapter: Errors first
    heading: Start with the errors
    title: toolkit/errors.py
    file: project/python-ai-toolkit/toolkit/errors.py
    steps:
      - lines: "1-2"
        note: "One base class for every error we raise **on purpose**."
        say: >
          Hum errors se shuru karte hain, kyunki baaki har module inhe use karta hai. ToolkitError har uss error ki base class hai jo hum jaan boojh kar raise karte hain.
      - lines: "5-10"
        note: "`ValidationError` remembers **which field** failed."
        say: >
          ValidationError ek zyaada specific type hai. Yeh parent ke init ko ek readable message ke saath call karta hai, aur yeh bhi yaad rakhta hai ki kaunsi field fail hui, taaki tests usse check kar sakein.

  - type: callout
    chapter: The data model
    kind: analogy
    title: "Validation is airport security"
    body: "Every bag goes through the scanner **once, at the entrance**. After that, everyone inside trusts it. We validate each raw record **at the edge**, and the rest of the code works only with records that passed."
    say: >
      Ab data model. Airport security socho. Har bag entrance par ek baar scanner se guzarta hai. Uske baad andar sab uss par bharosa karte hain. Hum bhi har raw record ko darwaaze par ek baar validate karte hain, aur baaki code sirf pass hue records ke saath kaam karta hai.

  - type: code
    heading: "models.py: one record, validated"
    title: toolkit/models.py
    file: project/python-ai-toolkit/toolkit/models.py
    lines: "1-41"
    steps:
      - lines: "7"
        note: "A **set** of allowed values: fast membership checks."
        say: >
          ALLOWED STATUS ek set hai, kyunki hum sirf yahi poochte hain: kya yeh status set mein hai?
      - lines: "10-13"
        note: "Missing field → a clear `ValidationError`, never a `KeyError`."
        say: >
          require ek chhota helper hai. Yeh field ki value lautaata hai, ya ValidationError raise karta hai ki field required hai. Ulajhne wala KeyError nahi.
      - lines: "16-22"
        note: "`True` is an `int` in Python, so reject `bool` explicitly."
        say: >
          Yeh helper non negative integer check karta hai. Ek chhupa hua trap hai: Python mein True aur False bhi ek tarah ke int hain. Isliye bools ko alag se reject karte hain.
      - lines: "25-36"
        note: "`frozen=True`: a record can't be changed after it's created."
        say: >
          Record khud ek dataclass hai, har field ke type hint ke saath. frozen equals True use read only banata hai, taaki validation ke baad koi chupke se record na badal sake.
      - lines: "38-40"
        note: "`@property`: computed, but used like an attribute: `record.total_tokens`."
        say: >
          total tokens ek property hai. Yeh baaki fields se calculate hoti hai, lekin aap use normal attribute ki tarah, bina brackets ke, use karte ho.

  - type: code
    heading: "from_dict: raw dictionary in, valid record out"
    title: toolkit/models.py
    file: project/python-ai-toolkit/toolkit/models.py
    lines: "42-86"
    steps:
      - lines: "42-45"
        note: "`@classmethod`: an alternative way to **create** the object."
        say: >
          from dict ek class method hai, object banane ka doosra tareeka. Isse class khud cls ke roop mein milti hai, aur yeh raw dictionary se record banata hai. Pehle check: item dictionary hai bhi ya nahi.
      - lines: "47-53"
        note: "`id` and `model` must be non-empty strings."
        say: >
          Phir har field check hoti hai. id aur model khaali nahi hone chahiye, aur strings hone chahiye.
      - lines: "55-59"
        note: "Latency: an `int` or a `float`, never a `bool`."
        say: >
          Latency negative nahi honi chahiye, int ya float, lekin phir se, bool nahi.
      - lines: "61-65"
        note: "The message lists the valid options."
        say: >
          Status allowed set mein hona chahiye. Message mein sahi options likhe hote hain, toh galti theek karna aasaan.
      - lines: "67-69"
        note: "Tags are optional: `.get()` with a default."
        say: >
          Tags optional hain, toh get aur khaali list default. Phir check ki yeh strings ki list hai.
      - lines: "71-75"
        note: "`from None` hides the internal error, keeping only our clear message."
        say: >
          Timestamp ke liye datetime dot fromisoformat parsing karta hai. Fail ho, toh hum apni error raise karte hain, from None ke saath, taaki user ko do jude hue tracebacks ki jagah ek saaf message dikhe.
      - lines: "77-86"
        note: "Reaching here means every field is valid."
        say: >
          Aakhir mein har validated value ke saath cls call hota hai. Yahan tak pahunche, matlab record pakka valid hai.

  - type: terminal
    repl: true
    title: python — python-ai-toolkit
    cwd: project/python-ai-toolkit
    alias: .
    say: >
      Model ko interactive Python prompt mein try karte hain, baaki code bane usse pehle hi. Project folder mein python type karke shuru karo.
    steps:
      - cmd: |
          from toolkit.models import UsageRecord
          row = {"id": "r1", "model": "model-small", "status": "ok"}
          row.update(prompt_tokens=10, completion_tokens=5, latency_ms=90)
          row["created_at"] = "2026-03-02T09:00:00"
          UsageRecord.from_dict(row).total_tokens
        say: >
          Ek valid dictionary step by step banayi. from dict ne record diya, aur total tokens pandrah.
      - cmd: |
          UsageRecord.from_dict({**row, "prompt_tokens": -1})
        keep: "1,-1"
        say: >
          Ab ek field ko minus ek kar do. Hamari ValidationError field ka naam aur galat value dono batati hai. Double star row dictionary ko copy karta hai, aur nayi key purani value ko badal deti hai.

  - type: code
    chapter: Loading files
    heading: "loader.py: read the file, collect the problems"
    title: toolkit/loader.py
    file: project/python-ai-toolkit/toolkit/loader.py
    steps:
      - lines: "9-19"
        note: "Two things can go wrong: no file, or invalid JSON. Both become a `ToolkitError`."
        say: >
          read json padhne ki do galtiyan sambhaalta hai. File ho hi na, ya valid JSON na ho. Dono ek saaf ToolkitError ban jaati hain, kharab JSON ke liye line aur column ke saath.
      - lines: "22-26"
        note: "Returns a **tuple**: the good records **and** the problems."
        say: >
          load records do lists ka tuple lautaata hai: valid records, aur har invalid record ka message. File ka top level ek list hona chahiye.
      - lines: "28-36"
        note: "One bad record must not stop the others from loading."
        say: >
          Phir enumerate ke saath loop, taaki record numbers ek se shuru hon. Jo record validation mein fail ho, woh problem ki list mein jaata hai, aur loop chalta rehta hai. Ek kharab record achhe records ko kabhi nahi rokta.

  - type: code
    chapter: Configuration
    heading: "config.py: settings from the environment"
    title: toolkit/config.py
    file: project/python-ai-toolkit/toolkit/config.py
    steps:
      - lines: "9-12"
        note: "Two settings: the prices file and the currency label."
        say: >
          Settings ek chhoti frozen dataclass hai, do configurable cheezon ke saath: prices file, aur currency label.
      - lines: "15-24"
        note: "`setdefault`: a real environment variable always wins over `.env`."
        say: >
          load dot env hamara chhota sa dot env reader hai. Khaali lines aur comments chhod deta hai, har line ko pehle equals sign par todta hai, aur setdefault use karta hai. Toh asli environment mein pehle se set variable hamesha file se jeetta hai.
      - lines: "27-33"
        note: "Sensible defaults for both."
        say: >
          load settings dono variables padhta hai, sensible defaults ke saath.
      - lines: "36-41"
        note: "Keys starting with `_` (like `_note`) are comments, not models."
        say: >
          Aur load prices prices file padhta hai, underscore se shuru hone wali keys chhod kar, jo hum comments ke liye use karte hain. Yeh fictional models ki example prices hain, per million tokens. Asli provider prices nahi.

  - type: code
    chapter: Statistics
    heading: "stats.py: the summary"
    title: toolkit/stats.py
    file: project/python-ai-toolkit/toolkit/stats.py
    lines: "1-45"
    steps:
      - lines: "6-7"
        note: "A **type alias** gives a long type a short name."
        say: >
          Prices ek type alias hai, lambe type hint ka chhota naam.
      - lines: "10-14"
        note: "Running totals for one model."
        say: >
          ModelStats ek model ke running totals rakhta hai, sab zero se shuru.
      - lines: "17-36"
        note: "`field(default_factory=...)`: fresh containers for every summary."
        say: >
          Summary report ka har number rakhta hai. Default factories phir se dekho, aur do properties jo total tokens aur success rate calculate karti hain, zero se divide hone se bachte hue.
      - lines: "39-45"
        note: "Unknown model → `None`, not a crash."
        say: >
          estimate cost prompt aur completion tokens ko unki prices se guna karta hai, aur ek million se divide. Anjaan model par crash nahi, None.

  - type: code
    heading: "summarize(): one pass over the records"
    title: toolkit/stats.py
    file: project/python-ai-toolkit/toolkit/stats.py
    lines: "48-80"
    steps:
      - lines: "50-53"
        note: "`Counter` counts things: perfect for tags."
        say: >
          summarize har model ke stats ki dictionary, tags ke liye ek Counter, bina price wale models ka set, aur running cost taiyaar karta hai.
      - lines: "55-65"
        note: "`setdefault` creates the entry the first time a model appears."
        say: >
          Ek hi loop saari ginti karta hai. setdefault kisi model ke stats pehli baar dikhne par banata hai. Bina price wale models collect hote hain, crash nahi, aur Counter har tag ginta hai.
      - lines: "67-80"
        note: "Comprehensions and `sum()`, straight from lesson 2."
        say: >
          Aakhir mein comprehensions aur sum totals nikaalte hain, aur most common top teen tags deta hai. Lesson do ki saari cheezein, ek saath kaam karti hui.

  - type: terminal
    chapter: First results
    repl: true
    title: python — python-ai-toolkit
    cwd: project/python-ai-toolkit
    say: >
      Command line abhi bani nahi, lekin hisse pehle se kaam karte hain. Python prompt se unhe call karte hain.
    steps:
      - cmd: |
          from pathlib import Path
          from toolkit.loader import load_records
          records, problems = load_records(Path("data/usage_broken.json"))
          len(records), len(problems)
          problems[0]
        say: >
          Broken file load karne par ek valid record, aur chaar problems, har ek ka saaf message.
      - cmd: |
          from toolkit.config import load_prices
          from toolkit.stats import summarize
          prices = load_prices(Path("config/prices.json"))
          s = summarize(load_records(Path("data/usage_sample.json"))[0], prices)
          s.requests, s.ok, s.total_tokens, round(s.cost, 4)
          s.top_tags
        say: >
          Aur clean sample ka summary: das requests, aath successful, eleven thousand ninety five tokens, estimated cost, aur top teen tags.

  - type: interview
    chapter: Interview corner
    items:
      - q: "Why validate data at the edge instead of everywhere?"
        a: "One place checks raw input and turns it into a **trusted type** (`UsageRecord`). The rest of the code can rely on it, so checks aren't duplicated and bugs show up **where the bad data enters**."
        trap: "Sprinkling `if x is None` checks all over the code instead."
        say_q: "Interview corner. Pehla question: data ko har jagah ki jagah edge par validate kyun karte hain?"
        say_a: "Answer: ek hi jagah raw input check hota hai aur ek trusted type ban jaata hai. Baaki code uss par bharosa kar sakta hai, checks dohraaye nahi jaate, aur bug wahin dikhta hai jahan kharab data andar aaya. Trap: poore code mein jagah jagah if x is None likhna."
      - q: "What is `@classmethod` used for here?"
        a: "An **alternative constructor**: `UsageRecord.from_dict(raw)` builds and validates a record from a dictionary. It gets the class as `cls`, so it also works for subclasses."
        trap: "Putting all validation in `__init__` of a frozen dataclass, which makes simple construction in tests awkward."
        say_q: "Doosra: yahan classmethod kis kaam ka hai?"
        say_a: "Answer: yeh object banane ka doosra tareeka hai. from dict dictionary se record banata aur validate karta hai. Usse class cls ke roop mein milti hai. Trap: saari validation frozen dataclass ke init mein daal dena, jisse tests mein simple object banana mushkil ho jaata hai."
      - q: "Why is `isinstance(True, int)` a problem in validation?"
        a: "`bool` is a subclass of `int`, so `True` passes an `int` check. A field like `prompt_tokens: true` would be accepted as **1** unless you reject `bool` explicitly."
        trap: "Assuming JSON `true` can never reach a number field."
        say_q: "Teesra: validation mein isinstance True comma int problem kyun hai?"
        say_a: "Answer: bool, int ki subclass hai, toh True int check pass kar leta hai. prompt tokens true wali field ek ki tarah accept ho jaayegi, jab tak aap bool ko alag se reject na karo. Trap: maan lena ki JSON ka true kabhi number field tak nahi pahunchega."

  - type: callout
    chapter: Practice
    kind: practice
    title: "Try these before the next lesson"
    body: "Easy to hard. Answers are in the module's quiz.md."
    say: >
      Practice time. Video pause karo, aur khud try karo.
    items:
      - {text: "In the REPL, make a record with `status: \"done\"`. Read the message.", say: "Pehla: REPL mein status done wala record banao, aur message padho."}
      - {text: "Add `\"cancelled\"` to the allowed statuses. Which tests should change?", say: "Doosra: allowed statuses mein cancelled jodo. Kaunse tests badlne chahiye?"}
      - {text: "Add `cost_per_request` (cost ÷ requests) to `Summary` as a property, safe for zero requests", say: "Teesra: Summary mein cost per request property jodo, zero requests par bhi safe."}
      - {text: "Scenario: a log has 10,000 records and 3 are broken. What should the user see?", say: "Aur scenario: log mein das hazaar records hain, aur teen kharab. User ko kya dikhna chahiye?", pause: 6}

  - type: quiz
    chapter: Quick check
    number: 1
    question: "`load_records` finds 1 valid and 4 invalid records. What does it do?"
    options:
      - "Raises an error at the first invalid record"
      - "Returns the valid record and a list of 4 problems"
      - "Skips the bad records silently"
      - "Fixes the bad records automatically"
    answer: 1
    explain: "It returns `(records, problems)`: good records keep working, and every problem is reported with its record number."
    say_question: >
      Quick check. load records ko ek valid aur chaar invalid records milte hain. Woh kya karta hai?
    say_answer: >
      B. Valid record aur chaar problems ki list lautaata hai. Achhe records kaam karte rehte hain, aur har problem record number ke saath batayi jaati hai.

  - type: quiz
    number: 2
    question: "What does `frozen=True` on a dataclass do?"
    options:
      - "Makes the class faster"
      - "Stops anyone from changing an object's fields after it's created"
      - "Saves the object to disk"
      - "Validates the field types"
    answer: 1
    explain: "Assigning to a field of a frozen dataclass raises `FrozenInstanceError`. It doesn't validate types: that's `from_dict`'s job."
    say_question: >
      Doosra question. Dataclass par frozen equals True kya karta hai?
    say_answer: >
      B. Object banne ke baad koi uski fields nahi badal sakta. Types validate nahi karta. Woh kaam from dict ka hai.

  - type: recap
    chapter: Recap
    heading: Part 1 recap
    items:
      - {text: "Plan modules with one job each before writing code", say: "Recap. Code se pehle plan: har module ka ek kaam."}
      - {text: "Validate at the edge: raw dict → `UsageRecord` or a clear error", say: "Data ko darwaaze par validate karo: raw dictionary se trusted record, ya saaf error."}
      - {text: "Collect problems instead of crashing on the first one", say: "Pehli galti par crash nahi, problems collect karo."}
      - {text: "Keep calculation (`stats`) separate from formatting (`report`)", say: "Aur calculate karna, format karne se alag rakho."}
    outro: >
      Part do mein report, downloader, aur command line likhenge. Phir tayyar tool chalayenge, test karenge, aur module poora karenge.

  - type: title
    chapter: Next up
    kicker: Coming next · Module 1 · Lesson 7
    title: "Project, Part 2"
    subtitle: Reports, the command line, tests and wrap-up.
    say: >
      Lesson chhe complete. Toolkit ki neev taiyaar hai. Milte hain agle lesson mein.
