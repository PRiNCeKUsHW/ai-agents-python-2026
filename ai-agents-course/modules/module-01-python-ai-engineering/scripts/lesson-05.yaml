module_title: Python for AI Engineering
title: "Type Hints, HTTP Requests and Async"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 1 · Lesson 5
    title: Type hints, HTTP and async
    subtitle: Describe your data, talk to web APIs, and wait for many things at once.
    say: >
      Iss course ka har language model ek web API ke peeche rehta hai. Aap ek HTTP request bhejte ho, aur jawaab ka intezaar karte ho.
      Yeh lesson aapko teen tools deta hai jo isse achhe se karte hain: type hints, httpx se HTTP requests, aur async await.

  - type: objectives
    items:
      - {text: "Annotate functions with type hints and check them with mypy", say: "Iss lesson ke baad aap functions par type hints lagaoge, aur unhe type checker se check karoge."}
      - {text: "Understand requests, responses and status codes", say: "HTTP requests, responses, aur status codes samjhoge."}
      - {text: "Call web APIs with `httpx`, with timeouts and error handling", say: "httpx se web APIs call karoge, timeout aur error handling ke saath."}
      - {text: "Run slow operations concurrently with `async` and `await`", say: "Aur async await se dheemi cheezein ek saath chalaoge."}

  - type: callout
    chapter: Type hints
    kind: analogy
    title: "Type hints are labels on a courier box"
    body: "A parcel says **\"Fragile · 2 kg · Electronics\"**. The label doesn't change what's inside, but everyone handling it knows what to expect, and a scanner can **flag a mismatch before** it ships. That's a type hint, and mypy is the scanner."
    say: >
      Pehle what: type hint kya hai? Courier ka dabba socho, jis par likha hai: fragile, do kilo, electronics. Label andar ki cheez nahi badalta. Lekin sabko pata hota hai kya umeed karni hai, aur scanner bhejne se pehle hi galti pakad sakta hai. Type hint label hai, aur mypy scanner.

  - type: code
    heading: Type hints describe what goes in and out
    title: type_hints.py
    file: source/lesson-05/type_hints.py
    steps:
      - lines: "2-3"
        note: "`name: type` for parameters, `-> type` for the return value."
        say: >
          Har parameter ke baad colon aur type likhte ho, aur brackets ke baad ek arrow aur return type. Yeh function floats ki list leta hai aur ek float lautaata hai.
      - lines: "6-7"
        note: "`float | None` means: a float, **or** `None`."
        say: >
          Yahan dictionary strings se floats tak map karti hai, aur khadi line ka matlab hai ya. Function float lautaata hai, ya None, jab model na mile.
      - lines: "10-11"
        note: "Called correctly, everything works."
        say: >
          Sahi tarah call karo, toh sab theek chalta hai.
      - lines: "12"
        note: "Python does **not** check hints at runtime. This line still runs, and crashes."
        say: >
          Lekin important baat. Python chalte waqt hints check nahi karta. String pass karna allowed hai, aur crash function ke andar kahin gehraai mein hota hai.

  - type: terminal
    title: terminal — lesson-05
    cwd: source/lesson-05
    alias: .
    steps:
      - cmd: python type_hints.py
        exit: 1
        say: >
          Chalao: do sahi results, aur phir sum ke andar se ek ulajhne wala TypeError, asli galti se bahut door.
      - cmd: mypy type_hints.py
        exit: 1
        say: >
          mypy jaisa type checker code chalaye bina aapke hints padhta hai, aur galat argument wali exact line bata deta hai, chalane se pehle hi. Aapka editor bhi yahi hints autocomplete ke liye use karta hai.

  - type: cards
    heading: Hints you will use constantly
    cards:
      - {tag: basics, title: "Simple types", code: "str  int  float  bool", tone: teal, say: "Simple types: str, int, float, aur bool."}
      - {tag: collections, title: "What's inside", code: "list[str]\ndict[str, int]", tone: blue, say: "Collections batate hain ki andar kya hai: strings ki list, ya strings se ints tak dictionary."}
      - {tag: optional, title: "Maybe missing", code: "str | None", tone: violet, say: "None ke saath khadi line ka matlab: value missing ho sakti hai."}
      - {tag: fixed, title: "Fixed groups", code: "tuple[str, int]", tone: amber, say: "Tuple hint har position batata hai, jaise ek string aur ek int."}
    outro: >
      Module teen mein Pydantic naam ki library inhi hints se asli data ko chalte waqt validate karegi. Wahan hints sach mein taakatwar ban jaate hain.

  - type: callout
    chapter: HTTP in one picture
    kind: analogy
    title: "HTTP is ordering at a restaurant"
    body: "You (the **client**) tell the waiter your order (the **request**: what you want, plus details like \"no onion\"). The kitchen (the **server**) sends back your plate with a note (the **response**: a **status** like \"served\" or \"sold out\", plus the food, the **body**)."
    say: >
      Ab HTTP. Restaurant mein order socho. Aap client ho, waiter ko order dete ho, yahi request hai. Kitchen server hai. Woh plate ke saath ek note bhejta hai: serve ho gaya, ya khatam ho gaya. Yahi response aur status code hai.

  - type: diagram
    heading: HTTP in one picture
    nodes:
      - {id: client, label: Your Python code, sub: the client, x: 260, y: 300, w: 340, h: 140, tone: teal}
      - {id: server, label: Web API, sub: "a model, a search service...", x: 1460, y: 300, w: 380, h: 140, tone: violet}
      - {id: req, label: "GET /usage_sample.json", sub: "method · URL · headers · optional body", x: 860, y: 60, w: 560, h: 110, tone: blue, mono: true}
      - {id: res, label: "200 OK · application/json", sub: "status code · headers · body", x: 860, y: 545, w: 560, h: 110, tone: amber, mono: true}
    edges:
      - {from: client, to: server, label: request, bend: -0.18}
      - {from: server, to: client, label: response, bend: -0.18}
    say: >
      HTTP web APIs ki bhaasha hai, aur yeh jitna lagta hai usse aasaan hai.
    steps:
      - show: [client, server]
        say: >
          Do side hain. Client, yaani aapka Python code. Aur server, jaise kisi model provider ki API.
      - show: [req, "client->server"]
        focus: [client, req, server]
        flow: ["client->server"]
        say: >
          Client request bhejta hai. Usme ek method hota hai, jaise GET padhne ke liye, ya POST data bhejne ke liye. Ek URL, headers jinme extra jaankaari hoti hai jaise aapki API key, aur kabhi kabhi ek body.
      - show: [res, "server->client"]
        focus: [server, res, client]
        flow: ["server->client"]
        say: >
          Server response wapas bhejta hai: ek status code jo batata hai kaam kaisa raha, headers, aur body. AI APIs ki body lagbhag hamesha JSON hoti hai.

  - type: cards
    heading: Status codes you will meet
    cards:
      - {tag: 2xx, title: Success, body: "200 OK · 201 Created", tone: teal, say: "Do sau wale codes ka matlab success. Two hundred OK hai, two zero one matlab created."}
      - {tag: 4xx, title: Your request was wrong, body: "400 bad input · 401 bad key · 404 not found", tone: amber, say: "Chaar sau wale codes ka matlab galti aapki taraf hai. Galat input, galat ya missing API key, ya aisa URL jo hai hi nahi. Retry se kuch nahi hoga. Request theek karo."}
      - {tag: "429", title: Too many requests, body: "slow down: you hit a rate limit", tone: violet, say: "Four twenty nine ka apna card hai. Matlab aap rate limit tak pahunch gaye. Har model API mein yeh hoti hai, aur Module do mein sahi tareeke se ruk kar retry karna seekhoge."}
      - {tag: 5xx, title: The server failed, body: "500 error · 503 unavailable", tone: coral, say: "Aur paanch sau wale codes ka matlab server mein problem hai. Yeh aksar thodi der ki hoti hai, toh dhyaan se kiya retry kaam kar sakta hai."}

  - type: run
    chapter: Requests with httpx
    heading: Calling an API with httpx
    title: http_demo.py
    file: source/lesson-05/http_demo.py
    cwd: source/lesson-05
    cmd: python http_demo.py
    run: >
      python -m http.server 8765 --bind 127.0.0.1 --directory ../../project/python-ai-toolkit/data > /dev/null 2>&1 &
      sleep 1; python http_demo.py; status=$?; kill %1; exit $status
    say: >
      Ab asli requests. Taaki yeh offline bhi chale, project ka sample data ek chhote local web server se serve ho raha hai, Python ke built in http dot server se. Koi bahari service nahi.
    steps:
      - lines: "6-7"
        out: "1"
        note: "Always set a `timeout`, so a stuck server can't freeze your program."
        say: >
          httpx dot get ek GET request bhejta hai aur response object deta hai. Timeout hamesha do. Hamesha ke liye atki network call aapke agent ko jama degi. Response status code aur content type batata hai: two hundred, aur JSON.
      - lines: "8-10"
        out: "2"
        note: "`raise_for_status()` turns 4xx/5xx into an exception. `.json()` parses the body."
        say: >
          raise for status har error status ko exception bana deta hai, taaki failure chupke se na nikal jaaye. Phir dot json body ko Python objects mein parse karta hai. Das records.
      - lines: "12-15"
        out: "3"
        note: "A missing file: catch `HTTPStatusError` and read its status."
        say: >
          Aur yahan ek aisi file maangi jo hai hi nahi. HTTPStatusError pakad kar status code padha: four zero four.

  - type: compare
    chapter: Why async?
    heading: "Why async? Most AI time is spent waiting"
    left:
      title: "One by one: 3 × 1 s = 3 s"
      tone: coral
      items:
        - "Send request 1, **wait**…"
        - "Send request 2, **wait**…"
        - "Send request 3, **wait**…"
        - "The CPU sits idle almost the whole time"
    right:
      title: "Concurrently: about 1 s"
      tone: teal
      items:
        - "Send requests 1, 2 and 3"
        - "**Wait for all of them together**"
        - "Collect the three results"
        - "Same work, a third of the time"
    say: >
      Ab why async? Ek language model call mein kai second lag sakte hain, aur uss dauraan aapka program bas network ka intezaar karta hai. Ek chai wale ko socho: woh teen cups ek saath chadhata hai, ek ke ubalne ka intezaar karke doosra shuru nahi karta.
    steps:
      - show: left
        say: >
          Agar agent ko teen alag jawaab chahiye, aur woh ek ek karke maange, toh intezaar judta jaata hai. Ek ek second ki teen calls, teen second.
      - show: right
        say: >
          Async ke saath teeno shuru karo, saath mein intezaar karo, aur lagbhag ek second mein kaam khatam. Zyaada computing power nahi. Bas intezaar mein time barbaad nahi.

  - type: run
    heading: "async, await and asyncio.gather"
    title: async_demo.py
    file: source/lesson-05/async_demo.py
    cwd: source/lesson-05
    cmd: python async_demo.py
    steps:
      - lines: "6-8"
        note: "`async def` defines a **coroutine**. `await` pauses it while it waits."
        say: >
          async def ek coroutine banata hai, yaani aisa function jo ruk sakta hai. await ka matlab: yahan ruko jab tak yeh khatam na ho, aur tab tak doosra kaam chalne do. asyncio dot sleep yahan network reply ke intezaar ki jagah hai.
      - lines: "11-13"
        note: "Awaiting in a loop: each call waits for the previous one."
        say: >
          Yeh version loop mein har call ko await karta hai, toh woh phir bhi ek ke baad ek chalti hain.
      - lines: "16-20"
        note: "`asyncio.gather` runs them **concurrently** and returns results in order."
        say: >
          Yeh version teeno ko asyncio dot gather ko deta hai, jo unhe ek saath chalata hai, aur results usi order mein lautaata hai jis order mein unhe diya gaya.
      - lines: "23-26"
        out: "1-6"
        note: "`asyncio.run()` starts the event loop. A real measurement: 3.0 s vs 1.0 s."
        say: >
          Aakhir mein asyncio dot run event loop shuru karta hai, jo coroutines ko chalata hai. Dono versions ka time napa. Asli measurement: ek ek karke teen second, ek saath ek second.

  - type: run
    heading: Async HTTP with httpx
    title: async_http.py
    file: source/lesson-05/async_http.py
    cwd: source/lesson-05
    cmd: python async_http.py
    run: >
      python -m http.server 8765 --bind 127.0.0.1 --directory ../../project/python-ai-toolkit/data > /dev/null 2>&1 &
      sleep 1; python async_http.py; status=$?; kill %1; exit $status
    steps:
      - lines: "9-12"
        note: "`await client.get(...)`: the async version of `httpx.get`."
        say: >
          httpx ka ek async client bhi hai. fetch coroutine request ko await karta hai aur batata hai kitne records aaye.
      - lines: "15-19"
        out: "1-2"
        note: "`async with` opens the client and always closes it; `gather` fetches all URLs at once."
        say: >
          async with ek shared client kholta hai, aur baad mein theek se band karta hai. gather har URL ek saath laata hai. Dono files ek saath download hui: das records aur paanch records. Project ka fetch command bilkul aise hi kaam karta hai.

  - type: bullets
    heading: Async rules of thumb
    items:
      - {text: "`await` only works inside `async def`", say: "Async ke kuch niyam. await sirf async function ke andar chalta hai."}
      - {text: "Start the event loop once, with `asyncio.run(main())`", say: "Event loop ek hi baar shuru karo, program ke top par, asyncio dot run se."}
      - {text: "Async helps with waiting (network, disk), not heavy computation", say: "Async intezaar ko tez karta hai, network ya disk ka. Bhaari calculations ko tez nahi karta."}

  - type: interview
    chapter: Interview corner
    items:
      - q: "Does Python enforce type hints at runtime?"
        a: "No. Hints are for **tools** (mypy, your editor) and for readers. Libraries like **Pydantic** read them to validate data at runtime, but plain Python ignores them."
        trap: "Saying hints make code faster or safer by themselves."
        say_q: "Interview corner. Pehla question: kya Python chalte waqt type hints enforce karta hai?"
        say_a: "Answer: nahi. Hints tools ke liye hain, jaise mypy aur editor, aur padhne walon ke liye. Pydantic jaisi libraries unhe padh kar data validate karti hain, lekin plain Python unhe ignore karta hai. Trap: kehna ki hints khud code ko tez ya safe banate hain."
      - q: "Which HTTP errors should you retry?"
        a: "**429** (after waiting) and **5xx** (temporary server problems), plus timeouts, with backoff and a limit. **4xx** like 400/401/404 mean your request is wrong: retrying won't help."
        trap: "Retrying everything in a tight loop, which makes rate limits worse."
        say_q: "Doosra: kaunse HTTP errors par retry karna chahiye?"
        say_a: "Answer: four twenty nine, thoda ruk kar. Paanch sau wale, jo server ki temporary problem hain. Aur timeouts. Backoff aur limit ke saath. Chaar sau wale jaise four zero one ya four zero four ka matlab request galat hai, retry se kuch nahi hoga. Trap: sab par jaldi jaldi retry karna, jisse rate limit aur bigad jaati hai."
      - q: "Async vs threads vs processes: when is async the right choice?"
        a: "For **I/O-bound** work: many network or disk waits at once (model calls, API requests). For **CPU-heavy** work, async doesn't help; use processes."
        trap: "Calling a blocking function (like `time.sleep` or `httpx.get`) inside `async def`: it blocks every other task."
        say_q: "Teesra: async kab sahi choice hai?"
        say_a: "Answer: jab kaam I O bound ho, yaani bahut saare network ya disk ke intezaar ek saath, jaise model calls. Bhaari CPU ke kaam mein async madad nahi karta. Trap: async function ke andar blocking function chalana, jaise time dot sleep, ya normal httpx get. Woh baaki saare tasks ko rok deta hai."

  - type: callout
    chapter: Practice
    kind: practice
    title: "Try these before the next lesson"
    body: "Easy to hard. Answers are in the module's quiz.md."
    say: >
      Practice time. Video pause karo, aur khud try karo.
    items:
      - {text: "Add type hints to `shorten(text, max_words=8)` from lesson 3 and run mypy", say: "Pehla: lesson teen ke shorten function par type hints lagao, aur mypy chalao."}
      - {text: "In `http_demo.py`, print the response's `content-length` header", say: "Doosra: http demo mein response ka content length header print karo."}
      - {text: "Change `async_demo.py` to 5 tasks of 2 s each. Predict both times first.", say: "Teesra: async demo ko paanch tasks, do do second ke, bana do. Pehle dono times guess karo."}
      - {text: "Scenario: an agent calls a model API and sometimes gets 429. Describe a safe retry plan.", say: "Aur scenario: agent ko kabhi kabhi four twenty nine milta hai. Ek safe retry plan batao.", pause: 6}

  - type: quiz
    chapter: Quick check
    number: 1
    question: "An API replies with status `429`. What does it mean, and what should your code do?"
    options:
      - "The URL is wrong: fix it"
      - "Too many requests: wait, then retry"
      - "Success: read the body"
      - "The server crashed: give up"
    answer: 1
    explain: "429 means you hit a **rate limit**. Wait (often the response says how long), then retry. Module 2 implements this with backoff."
    say_question: >
      Quick check. API four twenty nine status deti hai. Matlab kya hai, aur code ko kya karna chahiye?
    say_answer: >
      B. Bahut zyaada requests. Rate limit lag gayi, toh ruko, phir retry karo. Module do mein backoff ke saath yeh theek se banayenge.

  - type: quiz
    number: 2
    question: "Three independent calls each take 2 seconds. About how long does `asyncio.gather` take?"
    options: ["6 seconds", "About 2 seconds", "0 seconds", "It depends on the CPU speed"]
    answer: 1
    explain: "They wait **together**, so the total is about the slowest one: ~2 s. One by one would be 6 s."
    say_question: >
      Doosra question. Teen alag calls, har ek do second ki. asyncio gather lagbhag kitna time lega?
    say_answer: >
      B, lagbhag do second. Teeno saath mein intezaar karti hain. Ek ek karke chhe second lagte.

  - type: recap
    chapter: Recap
    heading: Lesson 5 recap
    items:
      - {text: "Type hints document intent; `mypy` checks them before running", say: "Recap. Type hints aapka iraada likhte hain, aur mypy chalane se pehle check karta hai."}
      - {text: "HTTP = request (method, URL, headers, body) + response (status, body)", say: "HTTP matlab request aur response, aur status code batata hai kaam kaisa raha."}
      - {text: "`httpx` with a timeout and `raise_for_status()`", say: "httpx timeout ke saath, aur raise for status."}
      - {text: "`async`/`await` + `asyncio.gather` to wait for many calls at once", say: "Aur bahut saari calls ka ek saath intezaar: async, await, aur gather."}
    outro: >
      Ab project ke liye har Python skill aapke paas hai. Agle lesson mein Python AI Toolkit banana shuru karenge.

  - type: title
    chapter: Next up
    kicker: Coming next · Module 1 · Lesson 6
    title: "Project, Part 1"
    subtitle: Plan, data model and validation for the Python AI Toolkit.
    say: >
      Lesson paanch complete. Ab aap web APIs se baat kar sakte ho. Milte hain agle lesson mein, project ke saath.
