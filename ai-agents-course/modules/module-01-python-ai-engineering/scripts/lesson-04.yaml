module_title: Python for AI Engineering
title: "Modules, Packages, Files, JSON and Environment Variables"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 1 · Lesson 4
    title: Modules, files, JSON and secrets
    subtitle: Split code across files, read and write data, and keep API keys out of your code.
    say: >
      Asli AI projects kabhi ek file ke nahi hote. Woh disk se prompts aur documents padhte hain, APIs ke saath JSON ka len den karte hain, aur unhe secret API keys chahiye hoti hain, jo kabhi code mein nahi honi chahiye.
      Iss lesson mein yeh sab.

  - type: objectives
    items:
      - {text: "Split code into modules and packages, and import them", say: "Iss lesson ke baad aap code ko modules aur packages mein baant paoge, aur import kar paoge."}
      - {text: "Read and write files safely with `pathlib`", say: "pathlib se files safely padhoge aur likhoge."}
      - {text: "Convert between JSON and Python, and handle bad JSON", say: "JSON aur Python ke beech convert karoge, aur kharab JSON handle karoge."}
      - {text: "Keep configuration and secrets in environment variables", say: "Aur configuration aur secrets ko environment variables mein rakhoge."}

  - type: callout
    chapter: Modules and packages
    kind: analogy
    title: "Modules and packages are a well-organised almirah"
    body: "You don't throw every piece of clothing into one heap. Shirts go on one **shelf** (a module), the shelves sit in one **almirah** (a package), and you take out exactly what you need: **`from almirah import shirt`**."
    say: >
      Pehle what: modules aur packages kya hain? Ek almirah socho. Aap saare kapde ek dher mein nahi phenkte. Shirts ek shelf par, jeans doosri par. Har shelf ek module hai, poori almirah ek package. Aur zaroorat ho toh sirf woh nikaalte ho jo chahiye.

  - type: diagram
    heading: Modules and packages
    nodes:
      - {id: main, label: main.py, sub: your program, x: 260, y: 300, w: 300, tone: amber, mono: true}
      - {id: pkg, label: "textkit/", sub: a package (folder), x: 900, y: 300, w: 360, h: 440, tone: teal, mono: true, align: top}
      - {id: init, label: __init__.py, sub: runs on import, x: 900, y: 255, w: 280, h: 110, tone: blue, mono: true}
      - {id: clean, label: cleaning.py, sub: a module (file), x: 900, y: 405, w: 280, h: 110, tone: blue, mono: true}
      - {id: std, label: "json, pathlib, os", sub: standard library, x: 1450, y: 180, w: 340, tone: violet, mono: true}
      - {id: third, label: httpx, sub: "installed with pip", x: 1450, y: 450, w: 340, tone: violet, mono: true}
    edges:
      - {from: main, to: pkg, label: import textkit}
      - {from: pkg, to: std, dashed: true}
      - {from: pkg, to: third, dashed: true}
    say: >
      Ab dekhte hain Python code organise kaise hota hai.
    steps:
      - show: [clean]
        focus: [clean]
        say: >
          Module bas ek Python file hai. cleaning dot py mein jo bhi define hai, functions, classes, variables, sab kahin aur import ho sakta hai.
      - show: [pkg, init]
        focus: [pkg, init]
        say: >
          Package modules ka ek folder hai, jisme dunder init dot py naam ki file hoti hai. Package import hote hi yeh file chalti hai, aur aksar sabse kaam ke naam aage export karti hai.
      - show: [main, "main->pkg"]
        focus: [main, pkg]
        flow: ["main->pkg"]
        say: >
          Aapka program package ko naam se import karta hai, bilkul baaki cheezon ki tarah.
      - show: [std, third, "pkg->std", "pkg->third"]
        focus: [std, third]
        say: >
          Modules ke do aur source hain. Standard library, jo Python ke saath aati hai, jaise json, pathlib, aur os. Aur third party packages jo pip se install hote hain, jaise httpx.

  - type: code
    heading: "The package: a module and its __init__.py"
    title: textkit/cleaning.py
    file: source/lesson-04/textkit/cleaning.py
    steps:
      - lines: "1-3"
        note: "`split()` + `join()` collapses any run of spaces."
        say: >
          Yeh module hai. normalize text ko words mein todta hai, aur ek ek space se wapas jodta hai. Isse faaltu spaces hat jaate hain.
      - lines: "6-7"
        note: "Small functions that build on each other."
        say: >
          Aur word count normalize ko hi dobara use karta hai. Chhote functions, jo ek doosre par khade hain.

  - type: code
    title: textkit/__init__.py
    file: source/lesson-04/textkit/__init__.py
    steps:
      - lines: "2"
        note: "Re-export, so users can write `textkit.normalize(...)`."
        say: >
          Package ki init file dono functions import karti hai, taaki users unhe seedha textkit par call kar sakein.
      - lines: "4"
        note: "`__all__` lists the package's public names."
        say: >
          Aur dunder all batata hai ki kaunse naam public hain.

  - type: run
    heading: "main.py: two ways to import"
    title: main.py
    file: source/lesson-04/main.py
    cwd: source/lesson-04
    cmd: python main.py
    steps:
      - lines: "1-2"
        note: "`import x` keeps the prefix. `from x import y` brings in one name."
        say: >
          Import ke do tareeke. import textkit poora package laata hai, jise prefix ke saath use karte ho. Aur from textkit dot cleaning import word count, sirf ek naam laata hai.
      - lines: "5-8"
        out: "1-2"
        note: "The main function does the work."
        say: >
          main function kaam karta hai. Output mein saaf kiya hua text, aur teen words.
      - lines: "11-12"
        note: "True only when this file is **run**, not when it is **imported**."
        say: >
          Aakhri check Python ka ek idiom hai. dunder name equals dunder main tabhi true hota hai jab file seedhe chalayi jaaye. Koi doosri file isse import kare, toh main apne aap nahi chalta.

  - type: callout
    kind: error
    title: "ModuleNotFoundError: No module named 'textkit'"
    body: "Python searches for imports starting from the folder of the script you run (and installed packages). Run your program from the project root, or use `python -m package` for packages."
    say: >
      Agar apne hi package ke liye ModuleNotFoundError aaye, toh lagbhag hamesha aap galat folder se Python chala rahe ho. Python imports ko uss script ke folder se dhoondhna shuru karta hai jo aapne chalayi. Project root se chalao, aur packages ke liye python dash m.

  - type: run
    chapter: Files with pathlib
    heading: Reading and writing files
    title: files.py
    file: source/lesson-04/files.py
    cwd: source/lesson-04
    cmd: python files.py
    run: python files.py && rm notes.txt
    say: >
      Ab files. Prompts, documents, logs, aur reports, sab files mein rehte hain. Inke saath kaam karne ka modern tareeka hai pathlib.
    steps:
      - lines: "2-5"
        note: "Always pass `encoding=\"utf-8\"`. The default differs between operating systems."
        say: >
          Path object ek file ka path hai. write text file banata hai, ya overwrite karta hai. Aur hamesha encoding equals utf eight do. Windows par default encoding alag hota hai, aur AI ka text, jaise Hindi ya emoji, basic English ke bahar ke characters se bhara hota hai.
      - lines: "7-8"
        out: "1"
        note: "`read_text` gives one string; `splitlines` gives a list of lines."
        say: >
          read text poori file ek string mein deta hai, aur splitlines usse lines ki list bana deta hai.
      - lines: "10-11"
        note: "`with` closes the file automatically, even if an error happens."
        say: >
          Zyaada control chahiye, toh file ko with block ke andar kholo. Mode a ka matlab append, yaani end mein jodo. Aur with guarantee deta hai ki file band hogi, chaahe beech mein error aa jaaye.
      - lines: "13-15"
        out: "2-5"
        note: "Ask the path questions: exists, suffix, size."
        say: >
          Aakhir mein lines ko number do, aur path se kuch sawaal poocho: file hai ya nahi, uska suffix kya hai, aur kitne bytes. Teen lines, aur thirty four bytes.

  - type: compare
    chapter: JSON
    heading: JSON is how AI systems exchange data
    left:
      title: JSON text
      lang: json
      code: |
        {
          "id": "req-001",
          "tokens": 600,
          "ok": true,
          "error": null,
          "tags": ["summarize"]
        }
    right:
      title: Python objects
      code: |
        {
            "id": "req-001",       # str
            "tokens": 600,         # int
            "ok": True,            # bool
            "error": None,         # None
            "tags": ["summarize"], # list
        }
    say: >
      JSON data ke liye ek text format hai, aur AI engineering mein yeh har jagah hai. Model APIs JSON bhejti aur leti hain, tool calls JSON mein describe hote hain, aur logs aksar JSON hote hain. Isse ek common courier ka dabba samjho, jise har system khol sakta hai.
    steps:
      - show: left
        say: >
          JSON Python jaisa hi dikhta hai. Curly braces mein objects, square brackets mein arrays, strings, numbers, true, false, aur null.
      - show: right
        hl_left: [4, 5]
        hl_right: [4, 5]
        say: >
          Python ka json module inhe seedha map karta hai. Objects dictionaries ban jaate hain, arrays lists, aur true, false, null ban jaate hain capital True, False, aur None. Lekin JSON Python se zyaada strict hai. Strings ko double quotes chahiye, aur aakhri comma allowed nahi hai.

  - type: run
    heading: "json.dumps and json.loads"
    title: json_demo.py
    file: source/lesson-04/json_demo.py
    cwd: source/lesson-04
    cmd: python json_demo.py
    run: python json_demo.py && rm record.json
    steps:
      - lines: "5"
        note: "An ordinary Python dictionary."
        say: >
          Hum ek normal Python dictionary se shuru karte hain.
      - lines: "7-9"
        out: "1-6"
        note: "`json.dumps`: Python → JSON **string**. `indent=2` makes it readable."
        say: >
          json dot dumps, s matlab string, Python ko JSON text mein badalta hai. indent do se padhne mein aasaan. Output mein dekho: true aur null, chhote akshar mein. Phir ise file mein save kiya.
      - lines: "11-12"
        out: "7"
        note: "`json.loads`: JSON **string** → Python."
        say: >
          json dot loads ulta kaam karta hai, JSON text ko wapas Python objects banata hai. Isliye tokens phir se asli number hai: six hundred one. Aur ok ek bool.
      - lines: "14-17"
        out: "8"
        note: "Bad JSON raises `json.JSONDecodeError`, with the line and column."
        say: >
          Aur galat JSON par JSONDecodeError aata hai. Yahan aakhri comma ki wajah se. Error column tak batata hai. Language models kabhi kabhi thoda toota JSON dete hain, isliye yeh error aap bahut handle karoge.

  - type: callout
    chapter: Environment variables
    kind: analogy
    title: "Secrets are like your ATM PIN"
    body: "You never **write your PIN on the card**. The card (your code) can be shared, copied, photographed. The PIN stays **with you**, outside the card. API keys belong in **environment variables**, not in code."
    say: >
      Ab environment variables. Module zero mein humne yeh dekha tha, yahan Python ki taraf se. ATM card socho. PIN kabhi card par nahi likhte. Card ki photo kheench sakti hai, card kho sakta hai. PIN aapke paas rehta hai, card se alag. API key bhi code mein nahi, environment variable mein rehti hai.

  - type: bullets
    heading: Why environment variables?
    items:
      - {text: "Secrets stay out of your code", sub: "API keys in code end up in git history, screenshots and logs", say: "Ab why. Pehla: secrets code se bahar rehte hain. Source file mein likhi API key git history, screenshots, aur logs tak pahunch jaati hai."}
      - {text: "Settings change without editing code", sub: "a different model or price file per machine", say: "Doosra: code badle bina settings badal sakte ho. Jaise laptop par ek model, aur production mein doosra."}
      - {text: "Every platform supports them", sub: "your terminal, Docker, cloud hosts and CI", say: "Teesra: har platform inhe support karta hai. Terminal, Docker, cloud, aur CI pipelines. Module satrah tak aap inhe use karoge."}

  - type: run
    heading: "Reading settings with os.environ"
    title: env_demo.py
    file: source/lesson-04/env_demo.py
    cwd: source/lesson-04
    cmd: python env_demo.py
    steps:
      - lines: "2-5"
        note: "`os.environ.get(name, default)`: `None` (or the default) if not set."
        say: >
          os module environment variables ko environ naam ke dictionary jaise object mein deta hai. get, variable set na ho toh None deta hai, ya aapka chuna hua default.
      - lines: "7-11"
        out: "1-2"
        note: "Fail clearly if a secret is missing. Never print the secret itself."
        say: >
          Key missing ho toh saaf saaf bolo, baad mein ulajhne wale tareeke se fail mat ho. Aur secret khud kabhi print mat karo. Uski length print karna confirm karne ke liye kaafi hai. Abhi kuch set nahi hai, toh script mana kar deti hai, aur default model use hota hai.

  - type: terminal
    heading: "Set variables for one command"
    title: terminal — lesson-04
    cwd: source/lesson-04
    steps:
      - cmd: DEMO_API_KEY=fake-key-123 DEMO_MODEL=model-large python env_demo.py
        say: >
          Mac ya Linux par ek command ke liye variables aise set kar sakte ho. Yeh fake key hai, sirf demo ke liye. Key load hui, uski sirf length dikhi, aur model badal gaya.
    outro: >
      Windows PowerShell mein pehle dollar env colon DEMO API KEY equals, aur value quotes mein. Aur roz ke kaam ke liye dot env file, jo Module zero mein dekhi thi.

  - type: code
    heading: ".env files: convenient, but never committed"
    title: .env.example + .gitignore
    lang: text
    code: |
      # .env.example  (committed: documents which variables exist)
      TOOLKIT_PRICES_FILE=config/prices.json
      TOOLKIT_CURRENCY=USD
      LLM_API_KEY=your-key-here
      # .gitignore  (keeps real secrets out of git)
      .env
      .venv/
      __pycache__/
    steps:
      - lines: "1-4"
        note: "`.env.example` is a template with **fake** values. Safe to commit."
        say: >
          Har baar variables type karna thakaau hai, isliye projects unhe dot env file mein rakhte hain. Commit hota hai template, dot env dot example, fake values ke saath, taaki doosron ko pata ho kya set karna hai.
      - lines: "6-8"
        note: "The real `.env` is listed in `.gitignore`, so it never reaches git."
        say: >
          Asli dot env file mein aapki real keys hoti hain, aur woh dot gitignore mein listed hai, toh git usse kabhi record nahi karta. Project mein hum ek chhota loader likhenge jo dot env ko environment mein padhta hai. Aur asli environment variables hamesha file se jeette hain.

  - type: interview
    chapter: Interview corner
    items:
      - q: "What is the difference between a module and a package?"
        a: "A **module** is one `.py` file. A **package** is a folder of modules, usually with an `__init__.py`, imported by its folder name."
        trap: "Running a package's file directly (`python textkit/cleaning.py`) and wondering why its imports break. Use `python -m`."
        say_q: "Interview corner. Pehla question: module aur package mein kya farak hai?"
        say_a: "Answer: module ek dot py file hai. Package modules ka folder hai, aam taur par dunder init ke saath, jo folder ke naam se import hota hai. Trap: package ke andar ki file ko seedha chalana, aur phir sochna ki imports kyun toot gaye. python dash m use karo."
      - q: "`json.load` vs `json.loads`?"
        a: "`loads` parses a **string**; `load` reads from an open **file** object. Same pair for writing: `dumps` returns a string, `dump` writes to a file."
        trap: "Passing a file path string to `json.load`. It needs an open file, not a path."
        say_q: "Doosra: json load aur json loads mein farak?"
        say_a: "Answer: loads ek string ko parse karta hai, load ek khuli file se padhta hai. Likhne ke liye bhi yahi jodi: dumps string lautaata hai, dump file mein likhta hai. Trap: json load ko file ka path dena. Use khuli file chahiye, path nahi."
      - q: "An API key was committed to git. Is deleting the line enough?"
        a: "No. It stays in the git **history**, and may already be copied. **Revoke** the key, create a new one, and keep it in an environment variable or `.env` that is git-ignored."
        trap: "Only rewriting history. The key must be treated as leaked."
        say_q: "Teesra: ek API key git mein commit ho gayi. Kya line delete karna kaafi hai?"
        say_a: "Answer: nahi. Woh git history mein rehti hai, aur shayad copy bhi ho chuki hai. Key revoke karo, nayi banao, aur environment variable ya git ignored dot env mein rakho. Trap: sirf history saaf karna. Key ko leaked hi maano."

  - type: callout
    chapter: Practice
    kind: practice
    title: "Try these before the next lesson"
    body: "Easy to hard. Answers are in the module's quiz.md."
    say: >
      Practice time. Video pause karo, aur khud try karo.
    items:
      - {text: "Add `char_count(text)` to `textkit` and export it in `__init__.py`", say: "Pehla: textkit mein char count function jodo, aur init file se export karo."}
      - {text: "Save a list of 3 messages to `chat.json` and load it back", say: "Doosra: teen messages ki list chat dot json mein save karo, aur wapas load karo."}
      - {text: "Read `DEMO_MAX_TOKENS` as an **int**, default 500", say: "Teesra: DEMO MAX TOKENS ko int ki tarah padho, default five hundred. Dhyaan do: environment variables hamesha text hote hain."}
      - {text: "Scenario: a model returns JSON with a trailing comma. What does your code do so the app doesn't crash?", say: "Aur scenario: model aakhri comma wala JSON deta hai. App crash na ho, iske liye aapka code kya karega?", pause: 6}

  - type: quiz
    chapter: Quick check
    number: 1
    question: "Which call turns the JSON text `'{\"ok\": true}'` into a Python dictionary?"
    options: ["`json.dumps(text)`", "`json.loads(text)`", "`dict(text)`", "`json.load(text)`"]
    answer: 1
    explain: "`loads` = load from a **string**. `dumps` goes the other way. `json.load` (no s) reads from an open **file** object, not a string."
    say_question: >
      Quick check. Kaunsi call iss JSON text ko Python dictionary banati hai?
    say_answer: >
      B, json dot loads. s matlab string. dumps ulta jaata hai, aur bina s wala load khuli file se padhta hai.

  - type: quiz
    number: 2
    question: "Where should a real API key live?"
    options:
      - "In `config.py`, committed to git"
      - "In `.env.example`"
      - "In an environment variable (or a git-ignored `.env`)"
      - "In a code comment, so teammates can find it"
    answer: 2
    explain: "Real keys go in the environment or a git-ignored `.env`. `.env.example` is committed, so it holds only fake placeholders."
    say_question: >
      Doosra question. Asli API key kahan rehni chahiye?
    say_answer: >
      C. Environment variable mein, ya git ignored dot env mein. dot env dot example commit hoti hai, isliye usme sirf fake values.

  - type: recap
    chapter: Recap
    heading: Lesson 4 recap
    items:
      - {text: "A module is a file; a package is a folder with `__init__.py`", say: "Recap. Module ek file hai, aur package dunder init wala folder."}
      - {text: "`pathlib` + `encoding=\"utf-8\"` for every file", say: "Har file ke liye pathlib, aur encoding utf eight."}
      - {text: "`json.loads` / `json.dumps`; catch `JSONDecodeError`", say: "json loads aur dumps se convert karo, aur JSONDecodeError pakdo."}
      - {text: "Secrets live in environment variables; commit only `.env.example`", say: "Secrets environment variables mein, aur commit sirf example file."}
    outro: >
      Agle lesson mein type hints jodenge, HTTP par web APIs se baat karenge, aur dekhenge ki async AI apps ko tez kyun banata hai.

  - type: title
    chapter: Next up
    kicker: Coming next · Module 1 · Lesson 5
    title: Type hints, HTTP and async
    subtitle: Clearer code, talking to web APIs, and doing many things at once.
    say: >
      Lesson chaar complete. Ab aapka code files mein baanta hua hai, aur secrets surakshit hain. Milte hain agle lesson mein.
