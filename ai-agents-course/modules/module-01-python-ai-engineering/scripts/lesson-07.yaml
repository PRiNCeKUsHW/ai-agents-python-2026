  - type: title
    chapter: Next up
    kicker: Coming next · Module 2
    title: LLM Fundamentals and API Integration
    subtitle: "Tokens, context windows, message history, structured output, retries and costs. Project: an AI Study Assistant."
    say: >
      Module ek complete. Ab aapke paas woh Python foundation hai jis par yeh poora course khada hai. Module do mein aap aakhirkaar language model se baat karoge: tokens, context windows, message history, structured output, rate limits, aur costs. Aur ek AI Study Assistant banaoge. Milte hain wahan.
