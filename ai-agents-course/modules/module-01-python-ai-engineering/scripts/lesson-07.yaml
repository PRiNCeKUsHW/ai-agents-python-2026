module_title: Python for AI Engineering
title: "Project, Part 2: Reports, CLI, Tests and Wrap-up"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 1 · Lesson 7 · Project
    title: "Build the Python AI Toolkit, part 2"
    subtitle: Reports, downloads, the command line, a full demo, tests, and the module quiz.
    loop: [Plan, Model, Validate, Report]
    say: >
      Wapas swagat hai. Data layer kaam kar rahi hai. Ab report writer, downloader, aur command line jodenge. Phir tayyar tool chalayenge, test karenge, common errors theek karenge, aur module ko quiz aur challenge ke saath khatam karenge.

  - type: code
    chapter: Writing reports
    heading: "report.py: Markdown for people"
    title: toolkit/report.py
    file: project/python-ai-toolkit/toolkit/report.py
    lines: "1-33"
    steps:
      - lines: "6-8"
        note: "Takes a finished `Summary`, returns a string. It never prints."
        say: >
          render markdown ek summary leta hai aur text lautaata hai. Kuch print nahi karta. Isliye test karna aasaan, aur call karne wala decide karta hai ki text kahan jaaye.
      - lines: "9-18"
        note: "f-string formats: `:.1%` percent, `:,` thousands, `:.4f` four decimals."
        say: >
          Report lines ki list ki tarah banti hai, lesson do ke f string formats se. Colon point one percent percentage dikhata hai, aur colon point four f chaar decimal places.
      - lines: "19-26"
        note: "A Markdown table: one row per model."
        say: >
          Markdown table mein har model ki ek row.
      - lines: "27-33"
        note: "`\"\\n\".join(lines)` glues the lines together."
        say: >
          Phir top tags, enumerate se number ke saath. Kisi model ki price na ho, toh warning. Aur aakhir mein join sab lines ko ek string mein jod deta hai.

  - type: code
    heading: "report.py: JSON for programs"
    title: toolkit/report.py
    file: project/python-ai-toolkit/toolkit/report.py
    lines: "36-57"
    steps:
      - lines: "38-48"
        note: "Nested dictionaries mirror the JSON we want."
        say: >
          JSON report nested dictionaries banata hai, bilkul usi shape mein jo humein chahiye. Floats ko round karta hai taaki output saaf rahe.
      - lines: "49-55"
        note: "A dict comprehension and a list comprehension."
        say: >
          Dictionary comprehension har model ka section banata hai, aur list comprehension tags. Sets valid JSON nahi hote, isliye bina price wale models ek sorted list ban jaate hain.
      - lines: "57"
        note: "`json.dumps` turns it all into text."
        say: >
          Aur json dot dumps sab kuch text bana deta hai.

  - type: code
    chapter: Downloading logs
    heading: "fetch.py: concurrent downloads"
    title: toolkit/fetch.py
    file: project/python-ai-toolkit/toolkit/fetch.py
    steps:
      - lines: "11-15"
        note: "The async request from lesson 5."
        say: >
          fetch one lesson paanch wali async request hai. URL get karo, raise for status, aur JSON parse karo.
      - lines: "16-23"
        note: "Each kind of failure becomes one readable `ToolkitError`."
        say: >
          Har tarah ki failure ek readable ToolkitError ban jaati hai. Error status, network problem jaise refused connection, ya aisi body jo JSON nahi hai.
      - lines: "24-26"
        note: "The body has to be a list of records."
        say: >
          Aur body records ki list honi chahiye.
      - lines: "29-35"
        note: "`transport=` lets tests swap the network for a fake one."
        say: >
          fetch all ek client kholta hai, saare downloads ek saath gather karta hai, aur batches ko ek list mein jodta hai, URLs ke order mein. Optional transport parameter testing ke liye hai. Isse tests asli network ki jagah ek fake network laga sakte hain.

  - type: callout
    chapter: The command line
    kind: analogy
    title: "A CLI is a TV remote"
    body: "A remote has a few clear **buttons** (commands: `validate`, `report`, `fetch`), some take a **setting** (options: `--format json`), and every press either works or shows an error. `--help` is the label printed on the back."
    say: >
      Ab command line. TV remote socho. Kuch saaf buttons, yaani commands: validate, report, fetch. Kuch buttons ke saath setting, yaani options, jaise dash dash format json. Aur dash dash help remote ke peeche likha label hai.

  - type: code
    heading: "cli.py: argparse defines the commands"
    title: toolkit/cli.py
    file: project/python-ai-toolkit/toolkit/cli.py
    lines: "15-35"
    steps:
      - lines: "16-19"
        note: "`argparse` builds `--help` and error messages for you."
        say: >
          Standard library ka argparse command line ke text ko Python values mein badalta hai. Help text aur error messages bhi free mein banata hai.
      - lines: "20-23"
        note: "Sub-commands: `validate`, `report`, `fetch`."
        say: >
          Sub parsers alag commands dete hain, jaise git commit aur git push. validate ek file leta hai, aur type equals Path usse Path object bana deta hai.
      - lines: "25-30"
        note: "Options: `--format` (2 choices), `--out`, and a `--strict` flag."
        say: >
          report options jodta hai: format, sirf do choices ke saath. Optional output file. Aur strict flag, jo likhne par True hota hai.
      - lines: "32-34"
        note: "`nargs=\"+\"`: one or more URLs."
        say: >
          fetch ek ya zyaada URLs leta hai, aur output file zaroori hai.

  - type: code
    heading: "cli.py: one function per command"
    title: toolkit/cli.py
    file: project/python-ai-toolkit/toolkit/cli.py
    lines: "38-83"
    steps:
      - lines: "38-43"
        note: "Exit code **0** = success, **1** = problems found."
        say: >
          Har command ek function hai jo exit code lautaata hai. validate har problem print karta hai, aur kuch galat ho toh ek lautaata hai. Isse scripts aur CI pipelines failure pakad sakti hain.
      - lines: "46-56"
        note: "Warnings go to `sys.stderr`, so they never corrupt the report."
        say: >
          report settings aur records load karta hai. Warnings standard error par jaati hain, taaki save ya pipe ho rahi report mein kabhi na milein. strict ke saath koi bhi invalid record failure hai. Phir summary, aur renderer chunna: Markdown ya JSON.
      - lines: "57-63"
        note: "Write to `--out`, or print."
        say: >
          out diya ho toh text file mein likha jaata hai, warna print.
      - lines: "66-71"
        note: "`asyncio.run()` bridges normal code and async code."
        say: >
          fetch asyncio dot run se hamare async function ko normal code se chalata hai.
      - lines: "74-83"
        note: "A dict maps command names to functions. Errors are caught in **one** place."
        say: >
          Ek dictionary har command ke naam ko uske function se jodti hai, toh ifs ki lambi chain nahi. Aur main woh ek jagah hai jo ToolkitError pakadti hai. Traceback ki jagah ek saaf line print karti hai, aur ek lautaati hai.

  - type: code
    title: toolkit/__main__.py
    file: project/python-ai-toolkit/toolkit/__main__.py
    steps:
      - lines: "1-3"
        note: "`python -m toolkit` runs this file. `SystemExit` passes the exit code to the shell."
        say: >
          Aur dunder main woh file hai jo python dash m toolkit likhne par chalti hai. Yeh main call karti hai, aur uski return value ke saath SystemExit raise karti hai, jo program ka exit code ban jaata hai.

  - type: terminal
    chapter: Demo
    heading: "Demo: validate and report"
    title: terminal — python-ai-toolkit
    cwd: project/python-ai-toolkit
    steps:
      - cmd: python -m toolkit --help
        keep: "1-6"
        say: >
          Ab tayyar tool chalate hain. Help argparse ne banaya hai, teeno commands ke saath.
      - cmd: python -m toolkit validate data/usage_sample.json
        say: >
          Sample file poori tarah valid hai.
      - cmd: python -m toolkit validate data/usage_broken.json
        exit: 1
        say: >
          Broken file chaar exact problems batati hai.
      - cmd: echo $?
        run: python -m toolkit validate data/usage_broken.json > /dev/null; echo $?
        say: >
          Aur exit code ek hai. Isi se doosre programs ko pata chalta hai ki validation fail hui.

  - type: terminal
    title: terminal — python-ai-toolkit
    cwd: project/python-ai-toolkit
    steps:
      - cmd: python -m toolkit report data/usage_sample.json
        say: >
          Markdown report. Das requests, assi percent success rate. Aur average latency dekho, chaar second se zyaada. Kyunki ek failed request ne tees second liye. Average aise outliers ko chhupa deta hai, isliye module ke ek challenge mein aap percentile jodoge.

  - type: terminal
    title: terminal — python-ai-toolkit
    cwd: project/python-ai-toolkit
    steps:
      - cmd: python -m toolkit report data/usage_sample.json --format json --out reports/usage.json
        run: python -m toolkit report data/usage_sample.json --format json --out reports/usage.json && rm -rf reports
        say: >
          format json aur out ke saath report file mein save hoti hai, aur folder apne aap ban jaata hai.
      - cmd: head -12 reports/usage.json
        run: python -m toolkit report data/usage_sample.json --format json --out reports/usage.json > /dev/null && head -12 reports/usage.json && rm -rf reports
        say: >
          Yeh uss JSON file ki shuruaat hai, kisi dashboard ya doosre program ke liye tayyar.
      - cmd: python -m toolkit report data/usage_broken.json --strict
        exit: 1
        say: >
          Strict mode mein broken file fail hoti hai, warning standard error par.
      - cmd: TOOLKIT_PRICES_FILE=config/missing.json python -m toolkit report data/usage_sample.json
        exit: 1
        say: >
          Aur settings environment se aati hain. Prices file ko aisi file par point karo jo hai hi nahi, toh ek saaf error line milti hai, koi traceback nahi.

  - type: terminal
    heading: "Demo: concurrent downloads"
    title: terminal — python-ai-toolkit
    cwd: project/python-ai-toolkit
    font: 25
    say: >
      Aakhir mein fetch. Ek local web server data folder ko port eight seven six five par serve kar raha hai, bilkul lesson paanch jaisa.
    steps:
      - cmd: URL=http://127.0.0.1:8765
        run: "true"
        say: >
          Command chhoti rakhne ke liye base address ek shell variable mein rakha.
      - cmd: python -m toolkit fetch $URL/usage_sample.json $URL/usage_broken.json --out data/merged.json
        run: >
          URL=http://127.0.0.1:8765;
          python -m http.server 8765 --bind 127.0.0.1 --directory data > /dev/null 2>&1 &
          sleep 1; python -m toolkit fetch $URL/usage_sample.json $URL/usage_broken.json --out data/merged.json;
          status=$?; kill %1; exit $status
        say: >
          Dono files ek saath download hui, aur pandrah records ek file mein jud gaye.
      - cmd: python -m toolkit validate data/merged.json
        run: >
          URL=http://127.0.0.1:8765;
          python -m http.server 8765 --bind 127.0.0.1 --directory data > /dev/null 2>&1 &
          sleep 1; python -m toolkit fetch $URL/usage_sample.json $URL/usage_broken.json --out data/merged.json > /dev/null;
          kill %1; python -m toolkit validate data/merged.json; status=$?; rm -f data/merged.json; exit $status
        exit: 1
        keep: "-1"
        say: >
          Merged file validate karne par gyaarah achhe records, aur wahi chaar problems.
      - cmd: python -m toolkit fetch http://127.0.0.1:9/logs.json --out data/x.json
        exit: 1
        say: >
          Aur agar server tak pahunch hi na sakein, toh phir se ek saaf line batati hai ki kya hua.

  - type: code
    chapter: Testing
    heading: "Tests: prove it works, keep it working"
    title: tests/test_models.py
    file: project/python-ai-toolkit/tests/test_models.py
    lines: "1-40"
    say: >
      Demo dikhata hai ki tool aaj kaam karta hai. Tests pakka karte hain ki badlaav ke baad bhi kaam karta rahe. Hum pytest use karte hain.
    steps:
      - lines: "7-11"
        note: "A test is a function named `test_...` that uses `assert`."
        say: >
          pytest test bas ek function hai jiska naam test se shuru hota hai, aur jo assert use karta hai. good row ek fixture hai. pytest parameter ka naam dekh kar ek nayi valid dictionary de deta hai, jo conftest dot py mein ek baar define hai.
      - lines: "14-22"
        note: "`parametrize`: the same test, run once per value."
        say: >
          parametrize ek hi test ko har value ke liye chalata hai. Yahan paanch tests, har ek alag required field hatata hai, aur check karta hai ki error ussi field ka naam le.
      - lines: "25-40"
        note: "Nine kinds of bad data, including `True` posing as an int."
        say: >
          Yeh test nau tarah ka kharab data deta hai, chalaak True samet jo number ban kar aata hai, aur check karta hai ki har ek sahi field ke liye reject ho.

  - type: code
    heading: "Testing HTTP without the network"
    title: tests/test_fetch.py
    file: project/python-ai-toolkit/tests/test_fetch.py
    lines: "10-37"
    steps:
      - lines: "10-19"
        note: "`httpx.MockTransport`: a fake server, inside the test."
        say: >
          Tests asli network par depend nahi hone chahiye, jo slow ho sakta hai ya band. httpx ka MockTransport network ki jagah ek function laga deta hai jo fake responses deta hai.
      - lines: "22-25"
        note: "Two downloads, merged in the right order."
        say: >
          Toh hum check kar sakte hain ki do downloads sahi order mein jude.
      - lines: "28-37"
        note: "404, or a body that isn't a list → `ToolkitError`."
        say: >
          Aur four zero four, ya list ke alaawa response, ToolkitError banta hai. Yeh milliseconds mein chalte hain, bina kisi server ke.

  - type: terminal
    title: terminal — python-ai-toolkit
    cwd: project/python-ai-toolkit
    steps:
      - cmd: python -m pytest -q
        say: >
          Poora suite chalao. Forty two tests, sab pass, ek second se bhi kam mein.
      - cmd: python -m pytest tests/test_fetch.py -v | grep PASSED
        run: python -m pytest tests/test_fetch.py -v -p no:cacheprovider | grep PASSED
        say: >
          dash v ke saath pytest har test ka naam dikhata hai.
      - cmd: mypy toolkit
        say: >
          Aur mypy confirm karta hai ki hamare saare type hints consistent hain.

  - type: terminal
    chapter: Troubleshooting
    heading: Two errors you will definitely see
    title: terminal — python-ai-toolkit
    cwd: project/python-ai-toolkit
    alias: .
    steps:
      - cmd: cd toolkit && python cli.py
        exit: 1
        keep: "-1"
        say: >
          Pehla: package ke andar ki file seedhe chalana. Python ko toolkit package nahi milta, kyunki woh toolkit folder ke andar se dhoondhna shuru karta hai. Fix: project root mein raho aur python dash m toolkit chalao.
      - cmd: deactivate
        run: "true"
        say: >
          Doosra: virtual environment bhool jaana.
      - cmd: python3 -m toolkit validate data/usage_sample.json
        run: /usr/bin/python3 -m toolkit validate data/usage_sample.json
        exit: 1
        keep: "-1"
        say: >
          Environment deactivate hai, toh system Python mein httpx install nahi hai. Fix: dot venv dobara activate karo.

  - type: cards
    heading: More common problems, and fixes
    cards:
      - {tag: "JSON", title: "is not valid JSON", body: "Trailing commas, single quotes or comments. Check the line and column in the message.", tone: coral, say: "is not valid JSON ka matlab aksar aakhri comma, single quotes, ya comment. Message line aur column batata hai."}
      - {tag: "paths", title: "file not found", body: "Relative paths start from where you **run** the command. Run from the project root.", tone: amber, say: "file not found ka matlab aksar command kisi aur folder se chali. Relative paths wahin se shuru hote hain jahan se aap chalate ho."}
      - {tag: "Windows", title: "Activate is blocked", body: "In PowerShell, run `Set-ExecutionPolicy -Scope CurrentUser RemoteSigned` once.", tone: blue, say: "Windows par PowerShell activate script chalane se mana kare, toh ek baar Set Execution Policy, current user ke liye, Remote Signed ke saath chalao."}
      - {tag: "text", title: "Strange characters", body: "Always read and write with `encoding=\"utf-8\"`.", tone: violet, say: "Aur text ajeeb characters mein aaye, toh dhyaan do ki har read aur write utf eight ke saath ho."}

  - type: interview
    chapter: Interview corner
    items:
      - q: "Why should a CLI return exit codes instead of only printing errors?"
        a: "Scripts, CI and other programs can't read your sentences, but they can read the exit code: **0** success, non-zero failure. `&&` and CI steps stop on failure because of it."
        trap: "Printing \"Error!\" and still exiting with 0, so the pipeline happily continues."
        say_q: "Interview corner. Pehla question: CLI ko sirf error print karne ki jagah exit code kyun lautaana chahiye?"
        say_a: "Answer: scripts, CI, aur doosre programs aapke sentences nahi padh sakte, lekin exit code padh sakte hain. Zero success, baaki failure. Do ampersand aur CI steps isi se rukte hain. Trap: Error print karna aur phir bhi zero ke saath exit karna. Pipeline khushi khushi aage chalti rehti hai."
      - q: "How do you test code that makes HTTP requests?"
        a: "Replace the network with a fake: `httpx.MockTransport` (or a fake client) returns prepared responses, including errors like 404. Tests become **fast and repeatable**, with no real server."
        trap: "Tests that call a real API: slow, flaky, and they can spend money or leak keys."
        say_q: "Doosra: HTTP requests wale code ko test kaise karte ho?"
        say_a: "Answer: network ki jagah ek fake lagao. httpx MockTransport pehle se tayyar responses deta hai, four zero four jaise errors samet. Tests tez aur repeatable bante hain, bina asli server ke. Trap: tests mein asli API call karna. Slow, kabhi pass kabhi fail, aur paise ya keys ka nuksaan."
      - q: "Why separate calculating (`stats`) from formatting (`report`)?"
        a: "Each part can be tested alone, and you can add a new output (JSON, CSV, a web page) without touching the maths. It's the **single responsibility** idea."
        trap: "One giant function that loads, calculates and prints: impossible to test or reuse."
        say_q: "Teesra: calculation aur formatting ko alag kyun rakhte hain?"
        say_a: "Answer: har hissa akele test ho sakta hai, aur naya output, jaise JSON, CSV, ya web page, ganit ko chhue bina jod sakte ho. Yahi single responsibility ka idea hai. Trap: ek bahut bada function jo load bhi kare, calculate bhi, aur print bhi. Na test ho sakta hai, na reuse."

  - type: recap
    chapter: Module recap
    heading: Module 1 recap
    items:
      - {text: "Lists, dicts and sets, with conversations as lists of message dicts", say: "Module recap. Aapne lists, dictionaries, aur sets use kiye, aur conversations ko message dictionaries ki list ki tarah banaya."}
      - {text: "Functions, dataclasses and custom exceptions", say: "Functions, dataclasses, aur apni exceptions likhi."}
      - {text: "Packages, `pathlib`, JSON and environment variables", say: "Package organise kiya, aur files, JSON, aur environment variables ke saath kaam kiya."}
      - {text: "Type hints, `httpx` and `asyncio.gather`", say: "Type hints lagaye, HTTP requests ki, aur downloads ek saath chalaye."}
