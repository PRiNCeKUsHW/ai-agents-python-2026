  - type: quiz
    chapter: Module quiz
    number: 1
    of: 5
    question: "An agent may only use the tools `search` and `calculator`. Which structure gives the fastest \"is this tool allowed?\" check?"
    options: ["A list", "A set", "A string", "A tuple"]
    answer: 1
    explain: "Membership checks on a **set** are fast however many items it holds, and duplicates are impossible."
    say_question: >
      Module quiz, pehla sawaal. Ek agent sirf do tools use kar sakta hai. Tool allowed hai ya nahi, iska sabse tez check kaunsa structure deta hai?
    say_answer: >
      B, set. Set kitna bhi bada ho, membership check tez rehta hai.

  - type: quiz
    number: 2
    of: 5
    question: "What does `@dataclass(frozen=True)` add to `UsageRecord`?"
    options: ["Faster JSON parsing", "Automatic validation of types", "Fields can't be changed after creation", "It can't be printed"]
    answer: 2
    explain: "Frozen dataclasses raise an error if you assign to a field after creation. Note: a dataclass does **not** validate types; that's why `from_dict` checks them."
    say_question: >
      Doosra sawaal. frozen equals True hamare usage record mein kya jodta hai?
    say_answer: >
      C. Record banne ke baad fields badli nahi ja sakti. Aur yaad rahe, dataclass khud types validate nahi karti. Isliye from dict har field check karta hai.

  - type: quiz
    number: 3
    of: 5
    question: "A command prints an error. How does a CI pipeline know it failed?"
    options: ["It reads the printed text", "From a non-zero exit code", "From the file size", "It can't know"]
    answer: 1
    explain: "Programs signal failure with a non-zero exit code. Our `validate` returns 1 when any record is invalid."
    say_question: >
      Teesra sawaal. Ek command error print karti hai. CI pipeline ko kaise pata chalta hai ki woh fail hui?
    say_answer: >
      B, non zero exit code se. Hamara validate kisi bhi invalid record par ek lautaata hai.

  - type: quiz
    number: 4
    of: 5
    question: "Why does `fetch_all` use `asyncio.gather`?"
    options:
      - "To retry failed downloads"
      - "To download all URLs concurrently, so total time ≈ the slowest one"
      - "To use more CPU cores"
      - "Because `httpx` requires it"
    answer: 1
    explain: "`gather` waits for all downloads at once. It saves waiting time; it doesn't add CPU power."
    say_question: >
      Chautha sawaal. fetch all asyncio dot gather kyun use karta hai?
    say_answer: >
      B. Taaki sab ek saath download ho, aur total time lagbhag sabse slow download jitna ho, sabka jod nahi.

  - type: quiz
    number: 5
    of: 5
    question: "Where should the real API key for your project live?"
    options: ["In `config.py`", "In `.env.example`", "In an environment variable or a git-ignored `.env`", "In the README"]
    answer: 2
    explain: "Secrets live in environment variables (or a `.env` that is in `.gitignore`). `.env.example` holds only fake placeholder values."
    say_question: >
      Aur paanchva sawaal. Project ki asli API key kahan rehni chahiye?
    say_answer: >
      C. Environment variable mein, ya git ignored dot env file mein. Example file mein hamesha sirf fake values.

  - type: callout
    chapter: Extension challenge
    kind: challenge
    title: "Extend the toolkit"
    body: "Pick one or more. Each needs code **and** a test. Ideas and hints are in the module's quiz.md."
    say: >
      Aage jaana hai, toh yeh raha extension challenge. Ek ya zyaada chuno, aur har ek ke liye code aur test dono likho.
    items:
      - {text: "Add a `--top N` option to `report` for the number of tags", say: "report command mein top N option jodo."}
      - {text: "Add p95 latency: sort the latencies and pick the 95th-percentile value", say: "p ninety five latency jodo. Average ki tarah yeh ek slow request se bigadti nahi."}
      - {text: "Add a per-day breakdown using `record.created_at.date()`", say: "created at timestamp se har din ka breakdown jodo."}
      - {text: "Add `--format csv` with the standard `csv` module", say: "Ya standard csv module se CSV output format jodo."}

