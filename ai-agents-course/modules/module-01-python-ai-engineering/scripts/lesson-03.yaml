module_title: Python for AI Engineering
title: "Functions, Classes and Exceptions"
narration: hinglish
scenes:
  - type: title
    chapter: Introduction
    kicker: Module 1 · Lesson 3
    title: Functions, classes and exceptions
    subtitle: Organise logic, model your data, and fail on purpose instead of by accident.
    say: >
      Pichle lesson mein humne data dekha. Ab hum code ko organise karenge. Functions logic ko naam dete hain, classes data aur behaviour ko saath rakhti hain, aur exceptions errors ko sambhaalti hain.
      Har AI agent, chaahe chhota ho ya bada, inhi teen cheezon par khada hota hai.

  - type: objectives
    items:
      - {text: "Write functions with parameters, defaults and return values", say: "Iss lesson ke baad aap parameters, default values, aur return values ke saath functions likh paoge."}
      - {text: "Avoid the mutable default argument bug", say: "Ek classic bug se bachoge, jo users ke beech data leak kar sakta hai."}
      - {text: "Create classes and dataclasses", say: "Apni classes, aur chhoti dataclasses banaoge."}
      - {text: "Handle, raise and define exceptions, and read tracebacks", say: "Aur exceptions handle karoge, raise karoge, apni exceptions banaoge, aur traceback aaram se padhoge."}

  - type: callout
    chapter: Functions
    kind: analogy
    title: "A function is a recipe card"
    body: "A recipe card for chai takes **inputs** (water, milk, sugar), does the **same steps** every time, and **gives back** one thing: a cup of chai. Write the card once, use it every morning."
    say: >
      Pehle what: function kya hai? Chai ka recipe card socho. Usme inputs hain: paani, doodh, cheeni. Har baar wahi steps hote hain. Aur end mein ek cheez milti hai: ek cup chai.
      Card ek baar likho, aur roz subah use karo. Function bhi yahi hai: inputs ko parameters kehte hain, aur jo wapas milta hai, woh return value.

  - type: run
    heading: "Functions: name a piece of logic"
    title: functions.py
    file: source/lesson-03/functions.py
    cwd: source/lesson-03
    cmd: python functions.py
    steps:
      - lines: "2-4"
        note: "`def name(parameters):` then an indented body. `return` sends a value back."
        say: >
          def keyword function shuru karta hai. Brackets ke andar parameters, yaani inputs. Teen quotes wala text docstring hai, jo batata hai ki function kya karta hai. Aur return result ko wapas bhejta hai.
      - lines: "7-8"
        out: "1-2"
        note: "Call by position, or by **keyword** for clarity."
        say: >
          Arguments position se de sakte ho, ya naam se, jinhe keyword arguments kehte hain. Kai numbers wali call mein keywords padhna bahut aasaan bana dete hain. Aur two million mein underscores dekho. Python unhe ignore karta hai, woh sirf padhne mein madad ke liye hain.
      - lines: "11-15"
        note: "`max_words=8` is a **default**: used when the caller doesn't pass a value."
        say: >
          Doosre function mein ek default value hai. Agar call karne wala max words na de, toh aath use hoga. Text pehle se chhota ho, toh wahin return. Warna pehle ke words rakh kar teen dots jod deta hai.
      - lines: "18-20"
        out: "3-5"
        note: "Long text is shortened; the last call overrides the default."
        say: >
          Teen calls: ek lambi line, ek chhoti line, aur ek jisme default badal diya. Output mein lambi line chhoti ho gayi, aur aakhri call mein sirf do words bache.

  - type: bullets
    heading: Habits for good functions
    items:
      - {text: "One job per function, named with a verb", sub: "`estimate_cost`, `load_records`, `render_report`", say: "Achhe functions ki aadatein. Har function ka ek hi kaam, aur naam ek verb se, jaise estimate cost, ya load records."}
      - {text: "Return values; don't print inside", sub: "the caller decides what to do with the result", say: "Result return karo, andar print mat karo. Phir call karne wala decide karega, aur test karna aasaan hoga."}
      - {text: "Use keyword arguments for anything unclear", say: "Jahan call samajh na aaye, wahan keyword arguments use karo."}
      - {text: "Never use a mutable default like `[]` or `{}`", sub: "it is shared between calls. See next.", tone: coral, say: "Aur kabhi bhi khaali list jaisa mutable default mat do. Kyun? Abhi dikhati hoon."}

  - type: run
    chapter: The mutable default bug
    heading: A bug that leaks data between users
    title: mutable_default.py
    file: source/lesson-03/mutable_default.py
    cwd: source/lesson-03
    cmd: python mutable_default.py
    steps:
      - lines: "2-4"
        note: "The default `[]` is created **once**, when the function is defined, and then reused."
        say: >
          Yeh function chat history rakhta hai. Default khaali list masoom lagti hai, lekin Python usse sirf ek baar banata hai, jab function define hota hai. Default use karne wali har call wahi ek list share karti hai.
      - lines: "7-8"
        out: "1-2"
        note: "Bob's conversation now contains Alice's message."
        say: >
          Toh Alice ne message bheja, phir Bob ne. Aur Bob ki history mein Alice ka message bhi aa gaya. AI app mein yeh privacy bug hai: ek user ki conversation doosre user tak pahunch gayi.
      - lines: "11-15"
        out: "3-4"
        note: "Default to `None`, then create a fresh list inside."
        say: >
          Fix Python ka standard pattern hai. Default None rakho, aur function ke andar nayi list banao. Ab har call saaf shuru hoti hai.

  - type: callout
    chapter: Classes
    kind: analogy
    title: "A class is a cookie cutter"
    body: "One **cookie cutter** (the class) makes many **cookies** (objects). Every cookie has the same shape, but each can have its own toppings (its **attributes**). What a cookie can do is its **methods**."
    say: >
      Ab classes. Functions behaviour ko organise karte hain. Classes data ko uske behaviour ke saath organise karti hain. Ek cookie cutter socho. Ek cutter se bahut saari cookies banti hain. Shape sabki same, lekin har cookie par apni topping ho sakti hai.

  - type: cards
    heading: Classes and objects
    cards:
      - {tag: class, title: The blueprint, body: "describes what every conversation has and can do", code: "class Conversation:", tone: teal, say: "Class ek blueprint hai, cookie cutter. Woh batati hai ki uss tarah ke har object ke paas kya hoga, aur woh kya kar sakta hai."}
      - {tag: object, title: One instance, body: "a real conversation built from the blueprint", code: 'chat = Conversation(...)', tone: blue, say: "Object, jise instance bhi kehte hain, uss blueprint se bani ek asli cheez hai. Jitne chaho utne bana sakte ho."}
      - {tag: attribute, title: Its data, body: "values stored on the object", code: "self.messages", tone: violet, say: "Attributes har object par rakha data hain."}
      - {tag: method, title: Its behaviour, body: "functions that belong to the class", code: "chat.add(...)", tone: amber, say: "Aur methods woh functions hain jo class ke hain, aur uss object ke data par kaam karte hain."}

  - type: run
    heading: "A Conversation class"
    title: classes.py
    file: source/lesson-03/classes.py
    cwd: source/lesson-03
    cmd: python classes.py
    steps:
      - lines: "2-4"
        note: "`__init__` runs when an object is created. `self` is the object itself."
        say: >
          Yeh Conversation class hai. Special dunder init method tab chalta hai jab naya object banta hai. Uska pehla parameter, self, wahi object hai jo ban raha hai. Isliye self dot messages ek list ko issi object par rakhta hai.
      - lines: "6-10"
        note: "Methods always take `self` first."
        say: >
          add aur last methods hain. Yeh bhi pehle self lete hain, taaki issi object ke messages padh aur badal sakein.
      - lines: "12-13"
        note: "`__len__` makes `len(chat)` work."
        say: >
          Do underscores wale methods aapki class ko Python se jodte hain. dunder len likhne se built in len function conversation par bhi chalta hai.
      - lines: "16-20"
        out: "1-2"
        note: "Creating an object looks like calling a function."
        say: >
          Object banana function call jaisa dikhta hai. Do messages jode, phir length aur aakhri message print kiya. Teen messages.
      - lines: "22-23"
        out: "3"
        note: "A second object has its own, separate list."
        say: >
          Doosri conversation ek bilkul alag object hai, apni alag list ke saath. Usme sirf system message hai.

  - type: run
    chapter: Dataclasses
    heading: "Dataclasses: less boilerplate for data"
    title: dataclass_demo.py
    file: source/lesson-03/dataclass_demo.py
    cwd: source/lesson-03
    cmd: python dataclass_demo.py
    say: >
      AI code ki bahut si classes zyaadatar sirf data rakhti hain: model ki configuration, usage record, tool ka result. Inke liye Python ka dataclass decorator boring hissa khud likh deta hai.
    steps:
      - lines: "5-9"
        note: "List the fields with types. `@dataclass` writes `__init__`, `__repr__` and `__eq__` for you."
        say: >
          Aap bas fields likho, unke types aur defaults ke saath. Decorator init method, ek readable print form, aur barabari ka comparison khud bana deta hai.
      - lines: "10"
        note: "Mutable defaults need `field(default_factory=list)`. The same rule as before!"
        say: >
          stop field dekho. Mutable default wala bug yaad hai? Dataclass aapko usse bachata hai. List default ke liye field aur default factory use karna zaroori hai.
      - lines: "13-17"
        out: "1-3"
        note: "A readable print form, and `==` compares the values."
        say: >
          Objects banaye, ek print kiya, aur same values wale do objects compare kiye. Print mein har field dikhti hai, aur barabari True hai. Project mein hamara usage record bhi ek dataclass hai.

  - type: callout
    chapter: Exceptions
    kind: analogy
    title: "Exceptions are a fire alarm"
    body: "When something goes wrong, an **alarm rings** (an exception is raised). If **someone responds** (`except`), the building keeps working. If nobody does, everything **stops**. A good building has alarms for specific problems, not one for everything."
    say: >
      Ab exceptions. Fire alarm socho. Kuch galat hua, toh alarm bajta hai. Yaani exception raise hoti hai. Koi respond kare, toh kaam chalta rehta hai. Koi na kare, toh sab ruk jaata hai. Python mein bhi yahi hota hai.

  - type: run
    heading: "Exceptions: try, except, else, finally"
    title: exceptions.py
    file: source/lesson-03/exceptions.py
    cwd: source/lesson-03
    cmd: python exceptions.py
    steps:
      - lines: "3-4"
        note: "`try`: code that might fail."
        say: >
          Jo code fail ho sakta hai, usse try block mein rakho. Text ko number banana fail hoga, agar text number nahi hai.
      - lines: "5-7"
        note: "`except ValueError`: runs **only** for that error type."
        say: >
          except block sirf ussi error par chalta hai. Yahan ValueError ko handle kiya: message diya aur zero return kiya.
      - lines: "8-9"
        note: "`else`: runs only if **no** exception happened."
        say: >
          else block tabhi chalta hai jab try safal raha.
      - lines: "10-11"
        out: "1-5"
        note: "`finally`: **always** runs, success or failure. Perfect for cleanup."
        say: >
          Aur finally hamesha chalta hai, kaam bane ya bigde. Cleanup ke liye, jaise connection band karna, yahi sahi jagah hai. Output ka order dekho: one twenty ke liye checked wali line value se pehle aati hai, kyunki finally function se nikalte waqt chalta hai. Aur a b c ke liye error handle hua, finally phir bhi chala, aur zero mila.

  - type: run
    chapter: Raising your own errors
    heading: Raise specific, meaningful errors
    title: custom_errors.py
    file: source/lesson-03/custom_errors.py
    cwd: source/lesson-03
    cmd: python custom_errors.py
    steps:
      - lines: "2-7"
        note: "Your own exception classes inherit from `Exception`."
        say: >
          Aap Exception se inherit karke apni exceptions bana sakte ho. Project ki ek base class, aur uske neeche specific errors, ek bahut achha pattern hai.
      - lines: "10-15"
        note: "`raise` stops the function and reports the problem to the caller."
        say: >
          raise function ko turant rokta hai, aur problem call karne wale ko de deta hai. Negative cost programming ki galti hai, isliye ValueError. Budget se zyaada kharcha business rule hai, isliye hamari apni BudgetExceeded error.
      - lines: "18-24"
        out: "1-3"
        note: "Agents need exactly this: a hard spending limit that stops the loop."
        say: >
          Caller sirf BudgetExceeded pakadta hai, aur charge karna rok deta hai. Pehle do charges chale, teesra mana ho gaya, saaf message ke saath. Agents ko bilkul aisa hi guard chahiye, ek pakki spending limit. Module saat mein isse theek se banayenge.

  - type: compare
    heading: Catch specific errors, never everything
    left:
      title: swallows every error
      tone: coral
      label: Avoid
      code: |
        try:
            result = call_tool(args)
        except:
            pass  # silently ignore
    right:
      title: handles what you expect
      tone: teal
      label: Prefer
      code: |
        try:
            result = call_tool(args)
        except TimeoutError:
            result = "Tool timed out, try again."
        # other errors still surface
    steps:
      - show: left
        say: >
          Left wala pattern kabhi mat likhna. Khaali except ke saath pass har error chhupa deta hai, aapke apne code ke bugs bhi. Program bina result ke chalta rehta hai, aur aapko pata hi nahi chalta kyun.
      - show: right
        say: >
          Right side par sirf woh error pakdo jo aap expect karte ho, aur jise handle karna aata hai. Baaki unexpected errors saamne aate hain, taaki aap unhe dekh kar theek kar sako.

  - type: terminal
    chapter: Reading a traceback
    heading: Read a traceback from the bottom up
    title: terminal — lesson-03
    cwd: source/lesson-03
    alias: .
    steps:
      - cmd: python traceback_demo.py
        exit: 1
        say: >
          Jab exception handle nahi hoti, Python traceback print karta hai. Darawna lagta hai, lekin usse neeche se upar padho. Aakhri line error hai: model key ke liye KeyError.
    outro: >
      Upar ki lines program ka raasta dikhati hain, sabse nayi call sabse neeche. Galat line hai config model, get model ke andar, jise start agent ne call kiya. Toh fix: configuration mein model zaroor ho, ya get aur default se padho.

  - type: interview
    chapter: Interview corner
    items:
      - q: "What is `self` in a Python method?"
        a: "The object the method was called on. `chat.add(...)` runs `Conversation.add(chat, ...)`, so `self` is `chat`. It lets each object keep its **own** data."
        trap: "Thinking `self` is a keyword. It's just the conventional name of the first parameter."
        say_q: "Interview corner. Pehla question: Python method mein self kya hai?"
        say_a: "Answer: woh object jis par method call hua. chat dot add, asal mein Conversation dot add chalata hai, chat ke saath. Isliye self chat hai, aur har object apna data rakh pata hai. Trap: self ko keyword samajhna. Yeh bas pehle parameter ka rivaaji naam hai."
      - q: "What's wrong with `def f(items=[])`?"
        a: "The default list is created **once** and shared by every call that uses it, so data leaks between calls. Use `items=None` and create a new list inside (or `field(default_factory=list)` in a dataclass)."
        trap: "Fixing it with `items=list()`. That's still evaluated once."
        say_q: "Doosra question: def f, items equals khaali list, mein kya galat hai?"
        say_a: "Answer: default list ek hi baar banti hai, aur har call use share karti hai. Data calls ke beech leak hota hai. items None rakho aur andar nayi list banao. Dataclass mein field default factory. Trap: items equals list bracket likhna. Woh bhi ek hi baar chalta hai."
      - q: "When should you write a bare `except:`?"
        a: "Almost never. Catch the **specific** exceptions you can handle. If you must catch broadly (for example at the top of a server), catch `Exception`, **log** it, and don't hide it."
        trap: "`except: pass`: it also swallows `KeyboardInterrupt` and your own bugs."
        say_q: "Teesra: khaali except kab likhna chahiye?"
        say_a: "Answer: lagbhag kabhi nahi. Specific exceptions pakdo jinhe handle kar sakte ho. Agar broad pakadna hi pade, jaise server ke top par, toh Exception pakdo, use log karo, aur chhupao mat. Trap: except pass. Yeh control C ko bhi nigal jaata hai, aur aapke bugs ko bhi."

  - type: callout
    chapter: Practice
    kind: practice
    title: "Try these before the next lesson"
    body: "Easy to hard. Answers are in the module's quiz.md."
    say: >
      Practice time. Video pause karo, aur khud try karo.
    items:
      - {text: "Write `word_count(text)` that returns the number of words", say: "Pehla: word count naam ka function likho, jo text ke words ki ginti return kare."}
      - {text: "Add a `clear()` method to `Conversation` that keeps only the system message", say: "Doosra: Conversation class mein clear method jodo, jo sirf system message rakhe."}
      - {text: "Make a `@dataclass` called `ToolCall` with `name: str` and `args: dict`", say: "Teesra: ToolCall naam ki dataclass banao, name aur args fields ke saath. Dhyaan rahe, args ka default kaise doge?"}
      - {text: "Scenario: an agent crashes on one bad tool result and loses the whole run. Where would you add `try`/`except`, and what would you catch?", say: "Aur scenario: ek kharab tool result se agent crash ho gaya, aur poora run gaya. try except kahan lagaoge, aur kya pakdoge?", pause: 6}

  - type: quiz
    chapter: Quick check
    number: 1
    question: "Why is `def add(msg, history=[])` dangerous?"
    options:
      - "Lists can't be parameters"
      - "The same list is shared by every call that uses the default"
      - "It makes the function slow"
      - "`history` becomes read-only"
    answer: 1
    explain: "Default values are created **once**, when the function is defined. Use `history=None` and create a new list inside."
    say_question: >
      Quick check. history equals khaali list wala default kyun khatarnaak hai?
    say_answer: >
      B. Default list ek baar banti hai, aur default use karne wali har call usse share karti hai. None default rakho, aur andar nayi list banao.

  - type: quiz
    number: 2
    question: "In `try / except / else / finally`, which block runs **every** time?"
    options: ["`try`", "`except`", "`else`", "`finally`"]
    answer: 3
    explain: "`finally` runs whether the `try` succeeded or failed. `else` runs only on success; `except` only on a matching error."
    say_question: >
      Doosra question. try, except, else, aur finally mein se kaunsa block har baar chalta hai?
    say_answer: >
      D, finally. else sirf success par chalta hai, aur except sirf matching error par.

  - type: recap
    chapter: Recap
    heading: Lesson 3 recap
    items:
      - {text: "Functions: one job, clear name, return the result", say: "Recap. Function ka ek kaam, saaf naam, aur result return."}
      - {text: "Default mutable arguments to `None`", say: "Mutable arguments ka default None."}
      - {text: "Classes bundle data and behaviour; `@dataclass` for data-heavy classes", say: "Classes data aur behaviour ko saath rakhti hain, aur dataclass data wali classes ko chhota bana deti hai."}
      - {text: "Catch specific exceptions, raise meaningful ones, read tracebacks bottom-up", say: "Specific exceptions pakdo, meaningful exceptions raise karo, aur traceback neeche se upar padho."}
    outro: >
      Agle lesson mein code ko files aur packages mein baantenge, aur files, JSON, aur environment variables ke saath kaam karenge.

  - type: title
    chapter: Next up
    kicker: Coming next · Module 1 · Lesson 4
    title: Modules, packages, files and JSON
    subtitle: Split your code across files, read and write data, keep settings out of code.
    say: >
      Lesson teen complete. Ab aapka code organised bhi hai, aur errors ke liye taiyaar bhi. Milte hain agle lesson mein.
